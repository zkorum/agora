<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Agora · Projects prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Agora Figma variables, from the "Latest" group (23471:120610). */
      :root {
        font-family: "Albert Sans", system-ui, sans-serif;
        color: #434149;
        background: #f6f5f8;
        font-synthesis: none;
        --ink: #434149;
        --muted: #6d6a74;
        --subtle: #9a97a4;
        --line: #e9e9f1;
        --soft: #f6f5f8;
        --brand: #6b4eff;
        --brand-dark: #5538ee;
        --brand-soft: #f0edff;
        --live: #198155;
        --live-bg: #ecfce5;
        --draft: #a05e03;
        --draft-bg: #ffefd7;
        --ended: #d3180c;
        --ended-bg: #ffe5e5;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; }
      button, input, textarea, select { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .45; }
      button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
        outline: 3px solid #ab9aff; outline-offset: 2px;
      }
      .shell { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 16px; min-height: 100vh; padding: 24px; }
      .sidebar { display: flex; flex-direction: column; border-inline-end: 1px solid var(--line); padding-inline-end: 16px; min-height: calc(100vh - 48px); }
      .logo { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px 12px; color: var(--brand); font-weight: 700; border-bottom: 1px solid var(--line); }
      .logo-mark { width: 26px; height: 30px; position: relative; display: inline-block; }
      .logo-mark::before, .logo-mark::after { content: ""; position: absolute; display: block; background: linear-gradient(140deg, #6b4eff, #4483ff); border-radius: 80% 6% 80% 8%; transform: rotate(-28deg); }
      .logo-mark::before { width: 12px; height: 24px; inset: 2px auto auto 3px; }
      .logo-mark::after { width: 11px; height: 24px; inset: 7px auto auto 13px; transform: rotate(53deg); }
      .nav { display: grid; gap: 2px; padding-top: 16px; }
      .nav-item, .account-item { display: flex; gap: 13px; align-items: center; width: 100%; min-height: 54px; border: 0; border-radius: 12px; background: transparent; text-align: start; padding: 0 16px; color: #62626f; font-weight: 600; }
      .nav-item:hover, .account-item:hover, .nav-item.active { background: var(--line); color: var(--ink); }
      .nav-icon { width: 20px; text-align: center; font-size: 19px; font-weight: 400; line-height: 1; }
      .sidebar-spacer { flex: 1; }
      .sidebar-create { width: 100%; margin-bottom: 24px; }
      .account { border-top: 1px solid var(--line); padding-top: 8px; }
      .account-item { min-height: 46px; }
      .main { min-width: 0; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 64px; padding: 0 10px 12px; }
      .topbar h1 { margin: 0; font-size: 24px; line-height: 1.25; letter-spacing: -.035em; color: #111116; }
      .topbar-actions, .row-actions, .detail-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .btn { display: inline-flex; justify-content: center; align-items: center; gap: 9px; min-height: 40px; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--line); background: white; color: var(--ink); font-weight: 600; white-space: nowrap; }
      .btn:hover { background: #f6f5ff; border-color: #cfc8ff; }
      .btn-primary { background: var(--brand); border-color: var(--brand-dark); color: white; }
      .btn-primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
      .btn-danger { color: #bb2a27; }
      .btn-danger:hover { background: #fff0f0; border-color: #ffd4d4; }
      .btn-icon { width: 40px; padding: 0; font-size: 19px; line-height: 1; }
      .btn-quiet { border-color: transparent; background: transparent; }
      .btn-quiet:hover { background: var(--soft); border-color: transparent; }
      .segmented { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 9px; background: white; }
      .segmented button { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; min-height: 30px; border-radius: 6px; font-weight: 600; }
      .segmented button.active { background: #eeeef4; color: var(--ink); }
      .surface { background: white; border: 1px solid var(--line); border-radius: 12px; min-height: calc(100vh - 112px); padding: 32px; }
      .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
      h2, h3, p { margin-top: 0; }
      .intro h2 { font-size: 22px; line-height: 1.25; letter-spacing: -.025em; margin-bottom: 6px; }
      .muted { color: var(--muted); }
      .subtle { color: var(--subtle); }
      .intro p { color: var(--muted); margin: 0; font-size: 14px; }
      .summary { display: flex; gap: 10px; flex-wrap: wrap; }
      .summary-item { border: 1px solid var(--line); background: #fcfcfe; border-radius: 10px; min-width: 100px; padding: 10px 14px; }
      .summary-item strong { display: block; font-size: 19px; }
      .summary-item span { font-size: 12px; color: var(--muted); }
      .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
      .toolbar-left { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .search { min-height: 40px; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; color: var(--subtle); background: #fff; }
      .search:focus-within { border-color: #aa9aff; }
      .search input { border: 0; outline: 0; background: transparent; width: 230px; min-width: 0; color: var(--ink); }
      .search input::placeholder { color: var(--subtle); }
      .project-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
      .project-card { min-width: 0; position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: visible; background: #fff; transition: border-color .15s, box-shadow .15s; }
      .project-card:hover { border-color: #c9c2fc; box-shadow: 0 8px 25px #3022650d; }
      .project-open { display: block; width: 100%; text-align: start; border: 0; background: transparent; padding: 9px 9px 22px; color: inherit; border-radius: 12px; }
      .cover { height: 120px; border-radius: 7px; background: var(--soft); position: relative; display: flex; align-items: flex-end; padding: 8px; }
      .avatar { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; background: #f66d4e; color: white; font-weight: 800; font-size: 12px; letter-spacing: -.06em; flex: none; }
      .avatar.brand { background: var(--brand); font-size: 18px; }
      .project-body { padding: 15px 12px 0; }
      .project-body h3 { font-size: 18px; margin: 11px 0 5px; line-height: 1.35; color: #101014; font-weight: 600; }
      .project-body p { margin: 0; font-size: 14px; color: #454550; }
      .status { display: inline-flex; align-items: center; gap: 8px; width: fit-content; border-radius: 9px; padding: 7px 11px; font-size: 13px; line-height: 1.2; font-weight: 600; }
      .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .status.live { color: var(--live); background: var(--live-bg); }
      .status.draft { color: var(--draft); background: var(--draft-bg); }
      .status.ended { color: var(--ended); background: var(--ended-bg); }
      .card-more { position: absolute; inset-block-start: 16px; inset-inline-end: 16px; width: 30px; height: 30px; border: 1px solid var(--line); background: white; border-radius: 8px; color: var(--muted); z-index: 1; }
      .card-more:hover { color: var(--brand); }
      .menu-wrap { position: relative; }
      .menu { position: absolute; inset-inline-end: 0; inset-block-start: calc(100% + 6px); z-index: 10; width: 168px; background: white; box-shadow: 0 12px 35px #17132726; border: 1px solid var(--line); padding: 5px; border-radius: 10px; }
      .project-card > .menu { inset-block-start: 49px; inset-inline-end: 16px; }
      .menu button { display: block; width: 100%; border: 0; padding: 10px 12px; text-align: start; border-radius: 6px; background: white; font-size: 14px; color: var(--ink); }
      .menu button:hover { background: var(--soft); }
      .menu button.danger { color: #c7312a; }
      .project-grid.list { grid-template-columns: 1fr; gap: 10px; }
      .project-grid.list .project-card { display: flex; align-items: center; min-height: 80px; }
      .project-grid.list .project-open { display: flex; align-items: center; gap: 16px; padding: 10px 70px 10px 10px; }
      .project-grid.list .cover { width: 60px; height: 56px; flex: none; }
      .project-grid.list .project-body { display: flex; align-items: center; flex: 1; gap: 14px; padding: 0; min-width: 0; }
      .project-grid.list .project-body h3 { flex: 1; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .project-grid.list .project-body p { min-width: 88px; text-align: end; }
      .project-grid.list .card-more { inset-block-start: 24px; }
      .project-grid.list .project-card > .menu { inset-block-start: 58px; }
      .empty { border: 1px dashed #dcdce8; border-radius: 12px; text-align: center; padding: 55px 20px; background: #fcfcfe; }
      .empty h3 { margin: 8px 0; }
      .empty p { color: var(--muted); font-size: 14px; }
      .breadcrumb { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 14px; color: var(--muted); }
      .breadcrumb button { border: 0; background: transparent; color: var(--muted); padding: 5px 0; white-space: nowrap; }
      .breadcrumb button:hover { color: var(--brand); }
      .breadcrumb span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .project-heading { display: flex; align-items: start; gap: 16px; }
      .project-heading .avatar { width: 64px; height: 64px; font-size: 22px; border-radius: 10px; }
      .project-heading h2 { font-size: 26px; letter-spacing: -.025em; margin: 0 0 4px; color: #101014; }
      .project-heading p { color: var(--muted); font-size: 14px; margin: 0; }
      .project-heading .status { margin-inline-start: auto; }
      .description-button { display: block; width: 100%; text-align: start; margin-top: 14px; padding: 16px; background: var(--soft); color: #40404b; border: 0; border-radius: 10px; line-height: 1.5; font-size: 14px; }
      .description-button:hover { background: #f0eefb; }
      .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 28px; border-top: 1px solid var(--line); padding-top: 25px; margin-top: 24px; }
      .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
      .section-heading h3 { margin: 0; font-size: 18px; }
      .activity-list { display: grid; gap: 14px; }
      .activity-card { position: relative; border: 1px solid var(--line); border-radius: 12px; background: white; }
      .activity-card:hover { border-color: #c9c2fc; }
      .activity-open { display: block; width: 100%; border: 0; border-radius: 12px; background: transparent; padding: 22px 25px 53px; text-align: start; color: inherit; }
      .activity-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
      .type { display: inline-flex; align-items: center; gap: 6px; width: fit-content; border-radius: 8px; padding: 7px 10px; background: var(--soft); font-size: 13px; font-weight: 600; color: #464650; }
      .activity-open h4 { font-size: 17px; margin: 10px 0 6px; color: #16161d; }
      .activity-open p { font-size: 14px; color: #50505c; line-height: 1.5; margin: 0; }
      .activity-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: absolute; inset-inline: 25px; inset-block-end: 15px; border-top: 1px solid #f1f1f5; padding-top: 12px; color: var(--subtle); font-size: 13px; }
      .activity-card .card-more { inset-block-start: auto; inset-block-end: 10px; inset-inline-end: 15px; border-color: transparent; }
      .activity-card > .menu { inset-block-start: auto; inset-block-end: 43px; inset-inline-end: 15px; }
      .side-panel { border: 1px solid var(--line); border-radius: 12px; padding: 20px; height: fit-content; background: #fcfcfe; }
      .side-panel h3 { margin-bottom: 15px; font-size: 16px; }
      .fact { border-top: 1px solid var(--line); padding: 13px 0; font-size: 13px; }
      .fact span { color: var(--muted); display: block; margin-bottom: 4px; }
      .fact strong { font-weight: 600; }
      .side-panel .btn { width: 100%; margin-top: 8px; }
      .activity-detail { max-width: 850px; }
      .activity-detail h2 { font-size: 27px; margin: 12px 0; }
      .activity-detail p { line-height: 1.6; color: #4e4e5a; }
      .activity-detail .row-actions { margin: 25px 0; }
      .activity-callout { background: #f7f5ff; border: 1px solid #e7e0ff; border-radius: 12px; padding: 22px; }
      .activity-callout p { margin-bottom: 0; font-size: 14px; }
      .overlay { position: fixed; inset: 0; background: #16132166; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 18px; }
      .dialog { width: min(100%, 560px); max-height: min(88vh, 900px); overflow: auto; background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 70px #16132133; padding: 32px; }
      .dialog.medium { width: min(100%, 728px); }
      .dialog.wide { width: min(100%, 972px); }
      .dialog-header { display: flex; align-items: start; justify-content: space-between; gap: 10px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
      .dialog-header h2 { margin-bottom: 5px; font-size: 24px; letter-spacing: -.03em; color: #111116; }
      .dialog-header p { color: var(--muted); font-size: 14px; margin: 0; }
      .dialog-body { padding: 22px 0; }
      .dialog-footer { display: flex; justify-content: flex-end; gap: 10px; padding-top: 18px; border-top: 1px solid var(--line); }
      .field { display: grid; gap: 9px; margin-bottom: 20px; font-size: 14px; font-weight: 600; }
      .field input, .field textarea, .field select, .link-field { width: 100%; border: 1px solid var(--line); background: white; border-radius: 10px; min-height: 52px; padding: 13px 15px; color: var(--ink); }
      .field textarea { min-height: 122px; resize: vertical; }
      .field input::placeholder, .field textarea::placeholder { color: var(--subtle); }
      .field-help { color: var(--muted); font-size: 13px; font-weight: 400; margin-top: -4px; }
      .setting { display: grid; gap: 7px; margin-bottom: 17px; }
      .setting > label { font-size: 14px; font-weight: 600; }
      .setting > select { border: 1px solid var(--line); border-radius: 9px; padding: 13px; min-height: 50px; background: white; color: var(--ink); }
      .setting small { color: var(--muted); }
      .choice-grid { display: grid; gap: 12px; }
      .dialog.wide .choice-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .choice { border: 1px solid var(--line); background: white; border-radius: 10px; text-align: start; padding: 17px; }
      .dialog.wide .choice { min-height: 248px; padding: 32px; }
      .choice:hover, .choice.selected { border-color: var(--brand); background: #f9f7ff; }
      .choice strong { display: block; margin-bottom: 7px; }
      .choice span { display: block; font-size: 13px; line-height: 1.5; color: var(--muted); }
      .reorder-list { display: grid; gap: 10px; }
      .reorder-row { display: flex; align-items: center; gap: 12px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
      .reorder-row > span { min-width: 24px; color: var(--subtle); font-weight: 700; }
      .reorder-row > div:first-of-type { flex: 1; min-width: 0; }
      .reorder-row strong { display: block; font-size: 14px; }
      .reorder-row small { color: var(--muted); }
      .preview { border: 1px solid var(--line); border-radius: 12px; padding: 26px; background: #fafafe; }
      .preview h3 { font-size: 24px; margin: 10px 0; }
      .preview p { color: var(--muted); line-height: 1.55; }
      .preview-list { display: grid; gap: 8px; margin-top: 18px; }
      .preview-list div { padding: 12px; background: white; border: 1px solid var(--line); border-radius: 8px; }
      .toast { position: fixed; z-index: 30; inset-inline-end: 24px; inset-block-end: 24px; padding: 12px 18px; border-radius: 9px; background: #292439; color: white; box-shadow: 0 10px 30px #29243933; font-size: 14px; }
      @media (max-width: 1050px) {
        .project-grid { gap: 14px; }
        .detail-layout { grid-template-columns: minmax(0, 1fr); }
        .side-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; }
        .side-panel h3, .side-panel .btn { grid-column: 1 / -1; }
      }
      @media (max-width: 760px) {
        .shell { display: block; padding: 0; }
        .sidebar { min-height: 0; border: 0; border-bottom: 1px solid var(--line); padding: 0 16px 8px; background: white; }
        .logo { height: 58px; padding: 0; border-bottom: 0; }
        .nav { display: flex; gap: 4px; overflow-x: auto; padding: 0; }
        .nav-item { min-height: 38px; flex: none; width: auto; padding: 0 10px; font-size: 13px; gap: 6px; }
        .nav-icon { width: 17px; font-size: 15px; }
        .sidebar-spacer, .sidebar-create, .account { display: none; }
        .main { padding: 16px; }
        .topbar { padding: 0 0 14px; min-height: 50px; flex-wrap: wrap; }
        .topbar h1 { font-size: 19px; }
        .topbar-actions { justify-content: flex-start; }
        .topbar-actions .btn { min-height: 36px; padding: 6px 10px; font-size: 13px; }
        .surface { min-height: calc(100vh - 154px); padding: 18px; }
        .intro { align-items: start; flex-direction: column; }
        .project-grid { grid-template-columns: 1fr; }
        .project-grid.list .project-body { display: block; }
        .project-grid.list .project-body h3 { white-space: normal; }
        .project-grid.list .project-body p { text-align: start; }
        .project-grid.list .status { display: none; }
        .search { flex: 1; }
        .search input { width: 100%; }
        .toolbar-left { width: 100%; }
        .project-heading { flex-wrap: wrap; }
        .project-heading h2 { font-size: 21px; }
        .project-heading .avatar { width: 48px; height: 48px; }
        .project-heading .status { margin-inline-start: 0; }
        .side-panel { display: block; }
        .detail-actions .btn { font-size: 13px; }
        .activity-open { padding-inline: 16px; }
        .activity-footer { inset-inline: 16px; }
        .dialog { padding: 20px; }
        .dialog.wide .choice-grid { grid-template-columns: 1fr; gap: 12px; }
        .dialog.wide .choice { min-height: 0; padding: 17px; }
      }
      @media (max-width: 420px) {
        .summary { width: 100%; }
        .summary-item { flex: 1; min-width: 0; }
        .segmented button { padding-inline: 7px; font-size: 12px; }
        .topbar-actions .compact-label { display: none; }
        .breadcrumb { font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const seed = [
        {
          id: 1, name: "A Greener Riverside", description: "Riverside is changing, and we want local people to help shape what happens next. This project explores how we can improve our parks, streets, transport links, air quality and access to the river. You can share your own ideas, respond to perspectives from across the community and help identify the changes that would have the greatest impact. The findings will be used to develop recommendations for a greener and healthier neighbourhood.", status: "live", organisation: "Civic Tomorrow Collective", visibility: "Private", authentication: "Guest participation", languages: "Auto", activities: [
            { id: 11, type: "Proposals", name: "Share your idea for a greener Riverside", description: "What practical change would make Riverside greener, healthier or more enjoyable? Submit a proposal describing your idea, who it would benefit and how it could work. Proposals might address green spaces, transport, biodiversity, waste, energy or access to the river.", status: "live", submissions: 62, views: 814, participants: 32 },
            { id: 12, type: "Mapping", name: "What should a greener Riverside look like?", description: "Explore ideas and perspectives submitted by people across Riverside. You can agree or disagree with existing statements and add a perspective that you think is missing. Your responses will help reveal common ground, differences of opinion and the priorities shared across the community.", status: "draft", submissions: 0, views: 0, participants: 0 },
            { id: 13, type: "Prioritising", name: "Choose the ideas we should take forward", description: "The community has suggested a range of ways to make Riverside greener. In this activity, you will compare the shortlisted ideas and rank the ones you believe should be taken forward first. Consider their potential impact, practicality and value to different parts of the community.", status: "draft", submissions: 0, views: 0, participants: 0 }
          ]
        },
        { id: 2, name: "The Future of Our Town Centre", description: "Help shape the future of our town centre. Share your thoughts on how we can make it a better place to live, work and visit.", status: "live", organisation: "Civic Tomorrow Collective", visibility: "Private", authentication: "Guest participation", languages: "Auto", activities: [] },
        { id: 3, name: "Youth Services Summit 2026 (in partnership with Agora)", description: "A summit exploring the future of youth services.", status: "ended", organisation: "Civic Tomorrow Collective", visibility: "Private", authentication: "Guest participation", languages: "Auto", activities: [] }
      ];

      const state = {
        projects: structuredClone(seed), page: "projects", projectId: undefined, activityId: undefined,
        view: "grid", filter: "all", search: "", menu: undefined, modal: undefined,
        activityType: undefined, activityStep: 1, activityProjectId: undefined,
        reorder: [], toast: "", nextId: 100
      };
      const app = document.querySelector("#app");
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
      const project = () => state.projects.find((item) => item.id === state.projectId);
      const activity = () => project()?.activities.find((item) => item.id === state.activityId);
      const badge = (status) => `<span class="status ${escapeHtml(status)}">${status.charAt(0).toUpperCase() + status.slice(1)}</span>`;
      const avatar = (large = false) => `<span class="avatar${large ? " brand" : ""}" aria-hidden="true">${large ? "✦" : "cTc"}</span>`;
      const plural = (count, word) => `${count} ${count === 1 ? word : word.endsWith("y") ? `${word.slice(0, -1)}ies` : `${word}s`}`;
      const actionButton = (label, action, extra = "", attrs = "") => `<button type="button" class="btn ${extra}" data-action="${action}" ${attrs}>${label}</button>`;
      const field = (label, name, value = "", placeholder = "", multiline = false) => `<label class="field">${label}${multiline ? `<textarea name="${name}" placeholder="${placeholder}">${escapeHtml(value)}</textarea>` : `<input name="${name}" value="${escapeHtml(value)}" placeholder="${placeholder}" />`}</label>`;

      function sidebar() {
        const nav = [["projects", "▢", "Projects"], ["explore", "◫", "Explore"], ["notifications", "♧", "Notifications"]];
        return `<aside class="sidebar"><div class="logo"><span class="logo-mark" aria-hidden="true"></span>Agora</div>
          <nav class="nav" aria-label="Main navigation">${nav.map(([page, icon, label]) => `<button class="nav-item ${state.page === page || (page === "projects" && ["project", "activity"].includes(state.page)) ? "active" : ""}" data-action="nav" data-page="${page}"><span class="nav-icon" aria-hidden="true">${icon}</span>${label}</button>`).join("")}</nav>
          <div class="sidebar-spacer"></div>${state.page === "projects" ? actionButton("＋ &nbsp; New activity", "new-activity", "btn-primary sidebar-create") : ""}
          <div class="account"><button class="account-item" data-action="nav" data-page="account">${avatar()} Jamie</button><button class="account-item" data-action="nav" data-page="settings"><span class="nav-icon" aria-hidden="true">⚙</span>Settings</button></div></aside>`;
      }

      function cardMenu(kind, id) {
        const key = `${kind}-${id}`;
        return `<button type="button" class="card-more" data-action="toggle-menu" data-key="${key}" aria-label="More options" aria-expanded="${state.menu === key}">⋮</button>${state.menu === key ? `<div class="menu"><button data-action="duplicate-${kind}" data-id="${id}">Duplicate</button><button class="danger" data-action="delete-${kind}" data-id="${id}">Delete</button></div>` : ""}`;
      }

      function projectsPage() {
        const filtered = state.projects.filter((item) => (state.filter === "all" || item.status === state.filter) && item.name.toLowerCase().includes(state.search.toLowerCase()));
        const live = state.projects.filter((item) => item.status === "live").length;
        return `<header class="topbar"><h1>Projects</h1><div class="topbar-actions">${actionButton("＋ <span class='compact-label'>New project</span>", "new-project")}</div></header>
          <main class="surface"><div class="intro"><div><h2>Your projects</h2><p>Manage the activities and ideas you share with your community.</p></div><div class="summary"><div class="summary-item"><strong>${state.projects.length}</strong><span>Total projects</span></div><div class="summary-item"><strong>${live}</strong><span>Live projects</span></div></div></div>
          <div class="toolbar"><div class="toolbar-left"><div class="search">⌕ <input aria-label="Search projects" placeholder="Search projects" value="${escapeHtml(state.search)}" data-search /></div><div class="segmented" aria-label="Project status">${[["all", "All"], ["live", "Live"], ["ended", "Ended"]].map(([key, label]) => `<button data-action="filter" data-filter="${key}" class="${state.filter === key ? "active" : ""}" aria-pressed="${state.filter === key}">${label}</button>`).join("")}</div></div><div class="segmented" aria-label="Project layout"><button aria-label="Grid view" aria-pressed="${state.view === "grid"}" class="${state.view === "grid" ? "active" : ""}" data-action="view" data-view="grid">▦</button><button aria-label="List view" aria-pressed="${state.view === "list"}" class="${state.view === "list" ? "active" : ""}" data-action="view" data-view="list">☷</button></div></div>
          ${filtered.length ? `<div class="project-grid ${state.view}">${filtered.map((item) => `<article class="project-card"><button type="button" class="project-open" data-action="open-project" data-id="${item.id}"><div class="cover">${avatar()}</div><div class="project-body">${badge(item.status)}<h3>${escapeHtml(item.name)}</h3><p>${plural(item.activities.length, "activity")}</p></div></button>${cardMenu("project", item.id)}</article>`).join("")}</div>` : `<div class="empty"><h3>No matching projects</h3><p>Try a different search or create a new project.</p>${actionButton("＋ New project", "new-project", "btn-primary")}</div>`}</main>`;
      }

      function projectPage() {
        const item = project();
        if (!item) { state.page = "projects"; return projectsPage(); }
        return `<header class="topbar"><div class="breadcrumb"><button data-action="nav" data-page="projects">Projects</button>›<span>Project details</span></div><div class="topbar-actions">${actionButton("↗ <span class='compact-label'>Share</span>", "share-project")}${actionButton("◉ <span class='compact-label'>View</span>", "preview-project")}${actionButton("⚙", "project-settings", "btn-icon", 'aria-label="Project settings"')}<div class="menu-wrap">${actionButton("⋮", "toggle-menu", "btn-icon", 'data-key="project-header" aria-label="Project options"')}${state.menu === "project-header" ? `<div class="menu"><button data-action="edit-project">Edit project</button><button data-action="duplicate-project" data-id="${item.id}">Duplicate</button><button class="danger" data-action="delete-project" data-id="${item.id}">Delete</button></div>` : ""}</div></div></header>
          <main class="surface"><div class="project-heading">${avatar(true)}<div><h2>${escapeHtml(item.name)}</h2><p>${escapeHtml(item.organisation)}</p></div>${badge(item.status)}</div><button type="button" class="description-button" data-action="edit-project" title="Edit project name and description">${escapeHtml(item.description || "Add a project description…")}</button>
          <div class="detail-layout"><section><div class="section-heading"><h3>Activities <span class="muted">(${item.activities.length})</span></h3><div class="row-actions">${item.activities.length > 1 ? actionButton("Reorder", "reorder") : ""}${actionButton("＋ New activity", "new-activity", "btn-primary")}</div></div>
          ${item.activities.length ? `<div class="activity-list">${item.activities.map((entry) => `<article class="activity-card"><button class="activity-open" data-action="open-activity" data-id="${entry.id}"><div class="activity-top"><span class="type">◇ ${escapeHtml(entry.type)}</span>${badge(entry.status)}</div><h4>${escapeHtml(entry.name)}</h4><p>${escapeHtml(entry.description || "Add a description for participants.")}</p></button><div class="activity-footer"><span>☏ ${entry.submissions} submissions</span><span>${entry.views} views · ${entry.participants} participants</span></div>${cardMenu("activity", entry.id)}</article>`).join("")}</div>` : `<div class="empty"><h3>No activities yet</h3><p>Start with proposals, mapping, or prioritising.</p>${actionButton("＋ New activity", "new-activity", "btn-primary")}</div>`}</section>
          <aside class="side-panel"><h3>Project details</h3><div class="fact"><span>Organisation</span><strong>${escapeHtml(item.organisation)}</strong></div><div class="fact"><span>Visibility</span><strong>${escapeHtml(item.visibility)}</strong></div><div class="fact"><span>Participation</span><strong>${escapeHtml(item.authentication)}</strong></div><div class="fact"><span>Languages</span><strong>${escapeHtml(item.languages)}</strong></div>${actionButton("Edit settings", "project-settings")}</aside></div></main>`;
      }

      function activityPage() {
        const item = activity();
        const parent = project();
        if (!item || !parent) { state.page = "projects"; return projectsPage(); }
        return `<header class="topbar"><div class="breadcrumb"><button data-action="nav" data-page="projects">Projects</button>›<button data-action="back-project">${escapeHtml(parent.name)}</button>›<span>${escapeHtml(item.name)}</span></div><div class="topbar-actions">${actionButton("↗ <span class='compact-label'>Share</span>", "share-activity")}${actionButton("◉ <span class='compact-label'>View</span>", "preview-activity")}</div></header>
          <main class="surface"><div class="activity-detail"><span class="type">◇ ${escapeHtml(item.type)}</span><h2>${escapeHtml(item.name)}</h2>${badge(item.status)}<p style="margin-top: 20px">${escapeHtml(item.description || "Add a description for participants.")}</p><div class="row-actions">${actionButton("Edit activity", "edit-activity")}${item.status === "draft" ? actionButton("Publish activity", "publish-activity", "btn-primary") : actionButton("End activity", "end-activity")}</div><div class="activity-callout"><strong>Activity overview</strong><p>${item.submissions} submissions · ${item.views} views · ${item.participants} participants</p></div></div></main>`;
      }

      function otherPage() {
        const content = { explore: ["Explore", "Discover projects and activities from the community."], notifications: ["Notifications", "You're all caught up."], settings: ["Settings", "Manage your account and preferences."], account: ["Jamie", "Your Agora profile and organisations."] };
        const [title, description] = content[state.page] || content.explore;
        return `<header class="topbar"><h1>${title}</h1></header><main class="surface"><div class="empty"><h2>${title}</h2><p>${description}</p>${actionButton("Back to projects", "nav", "", 'data-page="projects"')}</div></main>`;
      }

      function modalFrame(title, subtitle, body, footer, wide = false) {
        return `<div class="overlay" data-action="close-overlay"><section class="dialog ${wide ? "wide" : state.modal === "new-project" ? "medium" : ""}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="dialog-header"><div><h2>${escapeHtml(title)}</h2>${subtitle ? `<p>${escapeHtml(subtitle)}</p>` : ""}</div>${actionButton("×", "close-modal", "btn-icon btn-quiet", 'aria-label="Close dialog"')}</div><div class="dialog-body">${body}</div><div class="dialog-footer">${footer}</div></section></div>`;
      }

      function modalContent() {
        const item = project();
        switch (state.modal) {
          case "new-project":
            return modalFrame("New Project", "You can come back and edit these details at any time", `<form id="new-project-form">${field("Project name", "name", "", "Give your project a name")}${field("Description (optional)", "description", "", "Briefly explain what this project is about and why people should take part", true)}<div class="setting"><label>Organisation</label><div class="link-field">Civic Tomorrow Collective</div></div><div class="setting"><label for="new-visibility">Visibility</label><select id="new-visibility" name="visibility"><option>Private</option><option>Public</option></select><small>Private projects are visible to those with whom you share a link or QR code.</small></div></form>`, `${actionButton("Cancel", "close-modal")}<button class="btn btn-primary" type="submit" form="new-project-form">Create Project</button>`);
          case "edit-project":
            return modalFrame("Edit Project", "Update the project name and description", `<form id="edit-project-form">${field("Project name", "name", item.name, "Give your project a name")}${field("Description (optional)", "description", item.description, "Briefly explain what this project is about", true)}</form>`, `${actionButton("Cancel", "close-modal")}<button class="btn btn-primary" type="submit" form="edit-project-form">Save changes</button>`);
          case "project-settings":
            return modalFrame("Project settings", "", `<form id="settings-form"><div class="setting"><label for="visibility">Visibility</label><select id="visibility" name="visibility"><option ${item.visibility === "Private" ? "selected" : ""}>Private</option><option ${item.visibility === "Public" ? "selected" : ""}>Public</option></select><small>Private projects are only visible to people with a link or QR code.</small></div><div class="setting"><label for="authentication">Authentication</label><select id="authentication" name="authentication"><option ${item.authentication === "Guest participation" ? "selected" : ""}>Guest participation</option><option ${item.authentication === "Account required" ? "selected" : ""}>Account required</option></select><small>Choose how participants join your activities.</small></div><div class="setting"><label for="languages">Languages</label><select id="languages" name="languages"><option ${item.languages === "Auto" ? "selected" : ""}>Auto</option><option ${item.languages === "English" ? "selected" : ""}>English</option><option ${item.languages === "French" ? "selected" : ""}>French</option></select></div><div class="setting"><label>Organisation</label><div class="link-field">${escapeHtml(item.organisation)}</div></div></form>`, `${actionButton("Cancel", "close-modal")}<button class="btn btn-primary" type="submit" form="settings-form">Confirm</button>`);
          case "new-activity": {
            const options = [
              ["Proposals", "Invite participants to submit structured ideas in response to a question or challenge. Review proposals and use selected content in later activities."],
              ["Mapping", "Gather perspectives and reveal areas of agreement and disagreement. Participants respond to statements and can contribute new ones."],
              ["Prioritising", "Ask participants to compare or rank a fixed set of ideas, statements or options to learn which choices matter most."]
            ];
            if (state.activityStep === 1) return modalFrame("New Activity", "Choose an activity type", `<div class="choice-grid">${options.map(([type, description]) => `<button type="button" class="choice ${state.activityType === type ? "selected" : ""}" data-action="choose-type" data-type="${type}" aria-pressed="${state.activityType === type}"><strong>${type}</strong><span>${description}</span></button>`).join("")}</div>`, `${actionButton("Cancel", "close-modal")}${actionButton("Next", "next-activity", "btn-primary", state.activityType ? "" : "disabled")}`, true);
            const current = state.projects.find((entry) => entry.id === state.activityProjectId);
            return modalFrame("New Activity", "Add details and choose a project", `<form id="new-activity-form">${field("Activity name", "name", current ? `${current.name}: ${state.activityType}` : "", "Give your activity a name")}${field("Description (optional)", "description", "", "Briefly explain what this activity is about and why people should take part", true)}<label class="field">Project<select name="projectId" required>${state.projects.map((entry) => `<option value="${entry.id}" ${entry.id === state.activityProjectId ? "selected" : ""}>${escapeHtml(entry.name)}</option>`).join("")}</select></label></form>`, `${actionButton("Back", "back-activity")}<button class="btn btn-primary" type="submit" form="new-activity-form">Create activity</button>`, true);
          }
          case "edit-activity": {
            const entry = activity();
            return modalFrame("Edit Activity", "Update the activity details", `<form id="edit-activity-form">${field("Activity name", "name", entry.name, "Activity name")}${field("Description (optional)", "description", entry.description, "Describe the activity", true)}</form>`, `${actionButton("Cancel", "close-modal")}<button class="btn btn-primary" type="submit" form="edit-activity-form">Save changes</button>`);
          }
          case "reorder":
            return modalFrame("Reorder Activities", "Use the arrows to change the order", `<div class="reorder-list">${state.reorder.map((id, index) => { const entry = item.activities.find((candidate) => candidate.id === id); return `<div class="reorder-row"><span>${index + 1}</span><div><strong>${escapeHtml(entry.name)}</strong><small>${escapeHtml(entry.type)}</small></div><div class="row-actions">${actionButton("↑", "move-up", "btn-icon", `aria-label="Move ${escapeHtml(entry.name)} up" data-id="${id}" ${index === 0 ? "disabled" : ""}`)}${actionButton("↓", "move-down", "btn-icon", `aria-label="Move ${escapeHtml(entry.name)} down" data-id="${id}" ${index === state.reorder.length - 1 ? "disabled" : ""}`)}</div></div>`; }).join("")}</div>`, `${actionButton("Cancel", "close-modal")}${actionButton("Save order", "save-order", "btn-primary")}`);
          case "delete-project": case "delete-activity":
            return modalFrame(`Delete ${state.modal === "delete-project" ? "project" : "activity"}?`, "This action will remove it from this prototype.", `<p class="muted">${escapeHtml(state.modal === "delete-project" ? state.projects.find((entry) => entry.id === state.deleteId)?.name : item?.activities.find((entry) => entry.id === state.deleteId)?.name)}</p>`, `${actionButton("Cancel", "close-modal")}${actionButton("Delete", "confirm-delete", "btn-danger")}`);
          case "share": {
            const link = `${location.href.split("#")[0]}#${state.shareKind}-${state.shareId}`;
            return modalFrame("Share", "Copy a link to this prototype", `<label class="field">Link<input readonly value="${escapeHtml(link)}" id="share-link" /></label><p class="field-help">This is a local prototype link, not a published project URL.</p>`, `${actionButton("Close", "close-modal")}${actionButton("Copy link", "copy-link", "btn-primary")}`);
          }
          case "preview": {
            const entry = state.previewKind === "activity" ? activity() : item;
            return modalFrame("Participant preview", "A quick look at the participant-facing content", `<div class="preview">${badge(entry.status)}<h3>${escapeHtml(entry.name)}</h3><p>${escapeHtml(entry.description)}</p>${state.previewKind === "project" && item.activities.length ? `<div class="preview-list">${item.activities.filter((candidate) => candidate.status === "live").map((candidate) => `<div>${escapeHtml(candidate.name)}</div>`).join("")}</div>` : ""}</div>`, actionButton("Close", "close-modal"), true);
          }
          default: return "";
        }
      }

      function render() {
        const previousFocus = document.activeElement?.getAttribute("data-search") !== null && document.activeElement?.hasAttribute("data-search");
        const position = previousFocus ? document.activeElement.selectionStart : null;
        app.innerHTML = `<div class="shell">${sidebar()}<div class="main">${state.page === "projects" ? projectsPage() : state.page === "project" ? projectPage() : state.page === "activity" ? activityPage() : otherPage()}</div></div>${state.modal ? modalContent() : ""}${state.toast ? `<div class="toast" role="status">${escapeHtml(state.toast)}</div>` : ""}`;
        if (previousFocus) { const input = app.querySelector("[data-search]"); input?.focus(); input?.setSelectionRange(position, position); }
      }

      function notify(message) {
        state.toast = message;
        render();
        clearTimeout(notify.timer);
        notify.timer = setTimeout(() => { state.toast = ""; app.querySelector(".toast")?.remove(); }, 3000);
      }
      function openModal(name) { state.modal = name; state.menu = undefined; render(); }
      function closeModal() { state.modal = undefined; render(); }
      function navigate(page) { state.page = page; state.menu = undefined; state.modal = undefined; state.search = ""; render(); }

      app.addEventListener("click", async (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const { action } = target.dataset;
        const id = Number(target.dataset.id);
        if (action === "close-overlay") { if (target === event.target) closeModal(); return; }
        switch (action) {
          case "nav": navigate(target.dataset.page); break;
          case "filter": state.filter = target.dataset.filter; render(); break;
          case "view": state.view = target.dataset.view; render(); break;
          case "open-project": state.projectId = id; state.page = "project"; state.menu = undefined; render(); break;
          case "back-project": state.page = "project"; render(); break;
          case "open-activity": state.activityId = id; state.page = "activity"; state.menu = undefined; render(); break;
          case "toggle-menu": state.menu = state.menu === target.dataset.key ? undefined : target.dataset.key; render(); break;
          case "new-project": openModal("new-project"); break;
          case "edit-project": openModal("edit-project"); break;
          case "project-settings": openModal("project-settings"); break;
          case "edit-activity": openModal("edit-activity"); break;
          case "new-activity": state.activityType = undefined; state.activityStep = 1; state.activityProjectId = state.projectId ?? state.projects[0]?.id; openModal("new-activity"); break;
          case "choose-type": state.activityType = target.dataset.type; render(); break;
          case "next-activity": state.activityStep = 2; render(); break;
          case "back-activity": state.activityStep = 1; render(); break;
          case "reorder": state.reorder = project().activities.map((entry) => entry.id); openModal("reorder"); break;
          case "move-up": case "move-down": {
            const index = state.reorder.indexOf(id); const other = index + (action === "move-up" ? -1 : 1);
            if (other >= 0 && other < state.reorder.length) [state.reorder[index], state.reorder[other]] = [state.reorder[other], state.reorder[index]];
            render(); break;
          }
          case "save-order": project().activities.sort((a, b) => state.reorder.indexOf(a.id) - state.reorder.indexOf(b.id)); state.modal = undefined; notify("Activity order saved"); break;
          case "duplicate-project": {
            const original = state.projects.find((entry) => entry.id === id);
            const copy = structuredClone(original); copy.id = state.nextId++; copy.name += " (copy)"; copy.status = "draft"; copy.activities = copy.activities.map((entry) => ({ ...entry, id: state.nextId++, status: "draft", submissions: 0, views: 0, participants: 0 }));
            state.projects.push(copy); state.menu = undefined; notify("Project duplicated"); break;
          }
          case "duplicate-activity": {
            const original = project().activities.find((entry) => entry.id === id);
            project().activities.push({ ...original, id: state.nextId++, name: `${original.name} (copy)`, status: "draft", submissions: 0, views: 0, participants: 0 });
            state.menu = undefined; notify("Activity duplicated"); break;
          }
          case "delete-project": case "delete-activity": state.deleteId = id; openModal(action); break;
          case "confirm-delete":
            if (state.modal === "delete-project") { state.projects = state.projects.filter((entry) => entry.id !== state.deleteId); navigate("projects"); }
            else { project().activities = project().activities.filter((entry) => entry.id !== state.deleteId); state.page = "project"; state.modal = undefined; }
            notify("Deleted from prototype"); break;
          case "share-project": case "share-activity": state.shareKind = action.split("-")[1]; state.shareId = state.shareKind === "project" ? state.projectId : state.activityId; openModal("share"); break;
          case "preview-project": case "preview-activity": state.previewKind = action.split("-")[1]; openModal("preview"); break;
          case "copy-link": {
            const link = document.querySelector("#share-link");
            try { await navigator.clipboard.writeText(link.value); notify("Link copied"); } catch { link.select(); notify("Select the link to copy it"); }
            break;
          }
          case "publish-activity": activity().status = "live"; notify("Activity published in prototype"); break;
          case "end-activity": activity().status = "ended"; notify("Activity ended in prototype"); break;
          case "close-modal": closeModal(); break;
        }
      });

      app.addEventListener("input", (event) => {
        if (event.target.matches("[data-search]")) { state.search = event.target.value; render(); }
      });
      app.addEventListener("submit", (event) => {
        event.preventDefault();
        const form = event.target;
        const data = new FormData(form);
        const name = String(data.get("name") || "").trim();
        const description = String(data.get("description") || "").trim();
        if (form.id === "new-project-form") {
          if (!name) { form.elements.name.focus(); return; }
          const entry = { id: state.nextId++, name, description, status: "draft", organisation: "Civic Tomorrow Collective", visibility: String(data.get("visibility")), authentication: "Guest participation", languages: "Auto", activities: [] };
          state.projects.push(entry); state.projectId = entry.id; state.page = "project"; state.modal = undefined; notify("Project created");
        } else if (form.id === "edit-project-form") {
          if (!name) { form.elements.name.focus(); return; }
          Object.assign(project(), { name, description }); state.modal = undefined; notify("Project updated");
        } else if (form.id === "settings-form") {
          Object.assign(project(), { visibility: String(data.get("visibility")), authentication: String(data.get("authentication")), languages: String(data.get("languages")) }); state.modal = undefined; notify("Settings updated");
        } else if (form.id === "new-activity-form") {
          if (!name) { form.elements.name.focus(); return; }
          const parent = state.projects.find((entry) => entry.id === Number(data.get("projectId")));
          const entry = { id: state.nextId++, type: state.activityType, name, description, status: "draft", submissions: 0, views: 0, participants: 0 };
          parent.activities.push(entry); state.projectId = parent.id; state.activityId = entry.id; state.page = "activity"; state.modal = undefined; notify("Activity created as a draft");
        } else if (form.id === "edit-activity-form") {
          if (!name) { form.elements.name.focus(); return; }
          Object.assign(activity(), { name, description }); state.modal = undefined; notify("Activity updated");
        }
      });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape" && state.modal) closeModal(); else if (event.key === "Escape" && state.menu) { state.menu = undefined; render(); } });
      const sharedLink = location.hash.match(/^#(project|activity)-(\d+)$/);
      if (sharedLink) {
        const id = Number(sharedLink[2]);
        if (sharedLink[1] === "project" && state.projects.some((entry) => entry.id === id)) {
          state.projectId = id; state.page = "project";
        } else if (sharedLink[1] === "activity") {
          const parent = state.projects.find((entry) => entry.activities.some((candidate) => candidate.id === id));
          if (parent) { state.projectId = parent.id; state.activityId = id; state.page = "activity"; }
        }
      }
      render();
    </script>
  </body>
</html>
