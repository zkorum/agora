<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="An interactive navigation proposal connecting Agora discovery, participation, creation and facilitation."
    />
    <title>Agora — Connected journeys</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6b4eff;
        --blue: #4f92f6;
        --dark: #5538ee;
        --tint: #eeeeff;
        --ink: #222127;
        --muted: #6d6a74;
        --line: #e2e1e7;
        --canvas: #f6f5f8;
        --green: #177a41;
        --mint: #e2f1e8;
        --amber: #a05e03;
        --cream: #ffefd7;
        --white: #fff;
        --radius: 20px;
        --shadow: 0 8px 30px -18px #382a6450;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font:
          16px/1.5 "Albert Sans",
          system-ui,
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--dark);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      button {
        border: 0;
        background: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        line-height: 1.15;
        letter-spacing: -0.035em;
      }
      h1 {
        font-size: clamp(30px, 4vw, 44px);
        font-weight: 700;
      }
      h2 {
        font-size: 25px;
      }
      h3 {
        font-size: 20px;
      }
      p {
        color: var(--muted);
      }
      small,
      .small {
        font-size: 13px;
      }
      .muted {
        color: var(--muted);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dark);
      }
      .icon {
        width: 20px;
        height: 20px;
        flex: none;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrow {
        margin-inline-start: 6px;
      }
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 4px;
      }
      [hidden] {
        display: none;
      }
      .skip {
        position: fixed;
        inset-block-start: -100px;
        inset-inline-start: 10px;
        z-index: 200;
        background: white;
        padding: 15px;
      }
      .skip:focus {
        inset-block-start: 10px;
      }
      .prototype {
        min-height: 34px;
        background: #eeeaf6;
        color: #615779;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 5px 28px;
        font-size: 11px;
        letter-spacing: 0.025em;
      }
      .prototype strong {
        font-weight: 700;
      }
      .prototype-tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .prototype button {
        padding: 0;
        color: #54436f;
        text-decoration: underline;
        text-underline-offset: 3px;
        font-size: 11px;
      }
      .prototype select {
        font-size: 11px;
        max-width: 170px;
        background: #fff8;
        border: 1px solid #cfc7df;
        border-radius: 5px;
        padding: 2px 5px;
      }
      .topbar {
        height: 78px;
        position: sticky;
        inset-block-start: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 32px;
        padding: 0 max(28px, calc((100vw - 1240px) / 2));
        background: #ffffffed;
        backdrop-filter: blur(16px);
        border-bottom: 1px solid #e2e1e799;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -0.065em;
        color: var(--ink);
      }
      .brand:hover {
        text-decoration: none;
      }
      .brand svg {
        width: 31px;
        height: 32px;
      }
      .global-nav {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .global-nav a {
        padding: 9px 14px;
        border-radius: 10px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }
      .global-nav a.active {
        background: var(--tint);
        color: var(--dark);
      }
      .global-nav a:hover {
        background: var(--canvas);
        text-decoration: none;
      }
      .header-end {
        margin-inline-start: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .menu-button {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        font-size: 13px;
        font-weight: 600;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        background: linear-gradient(130deg, var(--primary), var(--blue));
        border-radius: 50%;
        color: white;
        font-size: 11px;
        font-weight: 700;
      }
      .header-login {
        font-size: 14px;
        font-weight: 600;
        color: var(--dark);
      }
      main {
        min-height: calc(100dvh - 190px);
        outline: none;
      }
      .wrap {
        max-width: 1180px;
        margin: auto;
        padding: 40px 28px 72px;
      }
      .narrow {
        max-width: 840px;
      }
      .section {
        margin-top: 40px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }
      .grid3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 30px;
        align-items: start;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 22px;
        margin-bottom: 28px;
      }
      .page-head p {
        margin-top: 12px;
        max-width: 610px;
      }
      .page-head .eyebrow {
        margin-bottom: 10px;
      }
      .card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--shadow);
      }
      .card p {
        margin-top: 9px;
      }
      .card.link-card {
        display: block;
        color: inherit;
        transition:
          transform 0.18s,
          border-color 0.18s;
      }
      .card.link-card:hover {
        transform: translateY(-3px);
        border-color: #baaff0;
        text-decoration: none;
      }
      .card-icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 13px;
        background: var(--tint);
        color: var(--dark);
        margin-bottom: 18px;
      }
      .card-icon.green {
        background: var(--mint);
        color: var(--green);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 18px;
        border-radius: 12px;
        background: white;
        border: 1px solid var(--line);
        font-size: 14px;
        font-weight: 700;
        text-align: center;
        line-height: 1.25;
      }
      .btn:hover {
        background: #f4f2fb;
        text-decoration: none;
        border-color: #c2b8e9;
      }
      .btn.primary {
        background: linear-gradient(115deg, var(--primary), #6276f9);
        color: #fff;
        border-color: transparent;
        box-shadow: 0 5px 14px -7px #6b4eff88;
      }
      .btn.primary:hover {
        background: var(--dark);
      }
      .btn.soft {
        background: var(--tint);
        color: var(--dark);
        border-color: transparent;
      }
      .btn.quiet {
        background: transparent;
        border-color: transparent;
        color: var(--muted);
      }
      .btn.small {
        min-height: 36px;
        padding: 8px 12px;
        font-size: 12px;
      }
      .text-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--dark);
        font-weight: 600;
        font-size: 14px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 30px;
        padding: 5px 10px;
        font-size: 11px;
        font-weight: 700;
        background: var(--tint);
        color: var(--dark);
        white-space: nowrap;
      }
      .pill.live {
        background: var(--mint);
        color: var(--green);
      }
      .pill.neutral {
        background: #efedf2;
        color: var(--muted);
      }
      .pill.amber {
        background: var(--cream);
        color: var(--amber);
      }
      .dot {
        height: 6px;
        width: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .divider {
        height: 1px;
        background: var(--line);
        margin: 20px 0;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 24px;
      }
      .breadcrumb a {
        color: var(--muted);
      }
      .breadcrumb .icon {
        width: 12px;
        height: 12px;
      }
      .notice {
        padding: 16px 20px;
        border: 1px solid #dcd5f4;
        background: #f1eefa;
        border-radius: 14px;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 24px;
      }
      .notice p {
        color: #615779;
      }
      .notice.success {
        background: #edf7f0;
        border-color: #cfe5d6;
        color: var(--green);
      }
      .notice strong {
        display: block;
        font-size: 14px;
      }
      .hint {
        font-size: 12px;
        line-height: 1.6;
        color: var(--muted);
      }
      .empty {
        text-align: center;
        padding: 55px 25px;
        border: 1px dashed #cfc8dd;
        border-radius: 20px;
        background: #fff8;
      }
      .empty .card-icon {
        margin: 0 auto 20px;
      }
      .empty p {
        max-width: 460px;
        margin: 12px auto 22px;
      }
      .tagline {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin-top: 22px;
      }
      .tagline span {
        display: inline-flex;
        gap: 5px;
        align-items: center;
      }
      .tagline .icon {
        width: 14px;
        height: 14px;
      }
      .hero {
        padding: 62px 52px;
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: 50px;
        align-items: center;
        background:
          radial-gradient(ellipse at 90% 10%, #e2e4ff 0, transparent 60%),
          linear-gradient(135deg, #faf8ff, #f1effb);
        border: 1px solid #e6e0f3;
        border-radius: 30px;
        overflow: hidden;
      }
      .hero h1 {
        font-size: clamp(38px, 4.4vw, 60px);
        line-height: 1.04;
        letter-spacing: -0.055em;
        margin: 20px 0;
      }
      .gradient-text {
        color: var(--primary);
      }
      .hero p {
        font-size: 17px;
        line-height: 1.65;
        max-width: 470px;
      }
      .hero .row {
        margin-top: 28px;
      }
      .hero-art {
        position: relative;
        padding: 32px 0 30px 25px;
      }
      .art-ring {
        position: absolute;
        width: 340px;
        height: 340px;
        border: 1px solid #c9bdf0;
        border-radius: 50%;
        inset-block-start: 0;
        inset-inline-start: 18px;
      }
      .art-ring::after {
        content: "";
        position: absolute;
        inset: 25px;
        border: 1px dashed #c9bdf0;
        border-radius: 50%;
      }
      .art-card {
        position: relative;
        background: #fffffff2;
        border: 1px solid #e3ddf0;
        box-shadow: 0 20px 50px -30px #45357c80;
        border-radius: 20px;
        padding: 23px;
        max-width: 345px;
        transform: rotate(-3deg);
      }
      .art-card h3 {
        font-size: 21px;
        line-height: 1.25;
        margin: 13px 0 18px;
      }
      .mini-votes {
        display: flex;
        gap: 6px;
      }
      .mini-votes span {
        flex: 1;
        padding: 9px 4px;
        border-radius: 9px;
        background: var(--cream);
        color: var(--amber);
        font-size: 11px;
        text-align: center;
      }
      .mini-votes span:nth-child(2) {
        background: var(--canvas);
        color: var(--muted);
      }
      .mini-votes span:nth-child(3) {
        background: var(--tint);
        color: var(--dark);
      }
      .art-result {
        position: relative;
        max-width: 285px;
        margin: 18px 0 0 70px;
        transform: rotate(3deg);
        padding: 20px;
        background: #fff;
        border: 1px solid #ded8eb;
        border-radius: 17px;
        box-shadow: var(--shadow);
      }
      .art-result strong {
        font-size: 15px;
      }
      .bar {
        height: 7px;
        background: #eeebf3;
        border-radius: 10px;
        overflow: hidden;
        margin: 12px 0;
      }
      .bar span {
        display: block;
        height: 100%;
        border-radius: 10px;
        background: linear-gradient(90deg, var(--primary), var(--blue));
      }
      .landing-label {
        text-align: center;
        max-width: 650px;
        margin: 55px auto 26px;
      }
      .landing-label p {
        margin-top: 12px;
      }
      .path-card {
        position: relative;
        padding: 30px;
      }
      .path-card h2 {
        margin: 12px 0;
      }
      .path-card .btn {
        margin-top: 24px;
      }
      .steps-line {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        margin: 18px 0 0;
      }
      .steps-line .icon {
        width: 12px;
        height: 12px;
      }
      .landing-footer {
        padding: 30px 0 0;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }
      .cover {
        height: 140px;
        position: relative;
        background: linear-gradient(135deg, #2d426e, #737bb8 65%, #b0c7e0);
        overflow: hidden;
      }
      .cover::before,
      .cover::after {
        content: "";
        position: absolute;
        width: 320px;
        height: 320px;
        border: 1px solid #ffffff45;
        border-radius: 50%;
        inset-block-start: -155px;
        inset-inline-end: -70px;
      }
      .cover::after {
        width: 230px;
        height: 230px;
        inset-block-start: 40px;
        inset-inline-start: -50px;
      }
      .cover.civic {
        background: linear-gradient(135deg, #426e65, #89ae97 65%, #d6dabc);
      }
      .cover.single {
        background: linear-gradient(130deg, #9a8bbc, #cbc2e5 70%, #e8ddec);
      }
      .cover .pill {
        position: absolute;
        inset-block-start: 14px;
        inset-inline-end: 14px;
        background: #fffffff0;
      }
      .cover-label {
        position: absolute;
        inset-inline-start: 22px;
        inset-block-end: 20px;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .project-card {
        padding: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .project-card-body {
        padding: 22px;
        display: flex;
        flex-direction: column;
        gap: 11px;
        flex: 1;
      }
      .project-card-body h3 {
        font-size: 23px;
      }
      .project-card-body p {
        font-size: 14px;
        margin: 0;
        flex: 1;
      }
      .project-card-body .row {
        margin-top: 8px;
      }
      .project-card .meta {
        border-top: 1px solid #efedf2;
        padding-top: 15px;
        margin-top: 7px;
        font-size: 12px;
        color: var(--muted);
      }
      .searchbar {
        display: flex;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        margin: 26px 0;
      }
      .search {
        position: relative;
        flex: 1;
        min-width: 220px;
      }
      .search .icon {
        position: absolute;
        inset-inline-start: 14px;
        inset-block-start: 13px;
        color: var(--muted);
      }
      .search input {
        padding-inline-start: 44px;
      }
      .tabs {
        display: flex;
        gap: 5px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        margin: 24px 0;
        overflow-x: auto;
      }
      .tabs a,
      .tabs button {
        padding: 12px 15px;
        color: var(--muted);
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
        border-bottom: 3px solid transparent;
      }
      .tabs .active {
        color: var(--dark);
        border-bottom-color: var(--primary);
      }
      .tabs a:hover {
        text-decoration: none;
        background: #eeeaf5;
      }
      .seg {
        display: flex;
        background: #edeaf2;
        padding: 4px;
        border-radius: 11px;
        gap: 3px;
      }
      .seg button {
        font-size: 13px;
        padding: 7px 12px;
        border-radius: 8px;
        color: var(--muted);
      }
      .seg button.active {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 5px #2211440a;
      }
      .project-banner {
        height: 188px;
        border-radius: 22px;
        margin-bottom: 28px;
      }
      .project-banner .cover-label {
        font-size: 13px;
        inset-block-end: 26px;
        inset-inline-start: 30px;
      }
      .project-intro {
        max-width: 780px;
        margin-bottom: 32px;
      }
      .project-intro h1 {
        font-size: clamp(34px, 4.5vw, 52px);
        margin: 12px 0;
      }
      .project-intro p {
        font-size: 17px;
        max-width: 660px;
      }
      .project-aside {
        padding-top: 12px;
      }
      .project-aside h3 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 16px;
      }
      .org {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .org-mark {
        width: 44px;
        height: 44px;
        border-radius: 13px;
        background: #263c64;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 13px;
        font-weight: 700;
        flex: none;
      }
      .activity-card {
        padding: 24px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: center;
      }
      .activity-card h3 {
        margin: 12px 0 8px;
        font-size: 21px;
      }
      .activity-card p {
        font-size: 14px;
        max-width: 620px;
      }
      .activity-card .meta {
        font-size: 12px;
        color: var(--muted);
        margin-top: 14px;
      }
      .activity-number {
        font-size: 12px;
        color: #99909e;
        margin-inline-end: 5px;
      }
      .owner-strip {
        padding: 11px 17px;
        background: #ece8f8;
        border: 1px solid #dcd3f0;
        border-radius: 12px;
        margin-bottom: 22px;
        display: flex;
        align-items: center;
        gap: 14px;
        justify-content: space-between;
        font-size: 12px;
      }
      .owner-strip span {
        color: #615779;
      }
      .conversation-title {
        max-width: 850px;
      }
      .conversation-title h1 {
        margin: 12px 0;
        font-size: clamp(28px, 3.5vw, 38px);
      }
      .conversation-title p {
        max-width: 680px;
      }
      .statement {
        padding: 25px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .statement blockquote {
        font-size: 21px;
        line-height: 1.5;
        letter-spacing: -0.015em;
        margin: 22px 0 28px;
      }
      .vote-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .vote-buttons button {
        border: 2px solid transparent;
        padding: 11px 5px;
        border-radius: 14px;
        background: var(--cream);
        color: var(--amber);
        font-size: 13px;
        font-weight: 600;
        min-height: 46px;
      }
      .vote-buttons button:nth-child(2) {
        background: #efedf2;
        color: var(--muted);

      "use strict";
      const $ = (selector) => document.querySelector(selector);
      const icon = (name) =>
        `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
      const esc = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[character]
        );
      const link = ({ to, label, style = "btn", symbol }) =>
        `<a class="${style}" href="#${to}">${symbol ? icon(symbol) : ""}${label}</a>`;
      const action = ({
        name,
        label,
        style = "btn",
        id = "",
        symbol,
        extra = "",
      }) =>
        `<button class="${style}" data-action="${name}" data-id="${esc(id)}" ${extra}>${symbol ? icon(symbol) : ""}${label}</button>`;
      const pill = ({ label, style = "" }) =>

      function renderNotes() {
        return `<div class="wrap narrow notes">${crumb([{ label: "Agora", to: "/" }, { label: "Design rationale" }])}<span class="eyebrow">Builder (10), refined by your feedback</span><h1 style="margin:14px 0 20px">One account.<br>A process that fits.</h1><p>The current proposal combines Puja’s process-builder direction with the flexibility of (4), your written feedback, and the decisions made in this conversation.</p><h2>1. Focused participation, clear dashboards</h2><p>A participant arriving by link sees the consultation. Wider navigation stays behind <strong>Account & more</strong>. The participant dashboard has Overview, recent visits, contributions, results and shared account settings. Created or managed work belongs in <strong>Facilitate</strong>.</p><p>Everyone can enter Facilitate and start something new. Only management of an existing consultation depends on that consultation’s permissions. Guest visits are remembered locally without requiring a contribution or account.</p>${journeyMap()}<h2>2. Activity first; project behind the scenes</h2><ul><li>Use <strong>Mapping</strong>, <strong>Proposals</strong> and <strong>Prioritising</strong>. No Talking or Listening activity is offered.</li><li>One editable sequence: drag and drop, move with arrows, repeat an activity at the end, remove it, or reset the order.</li><li>A single activity stands on its own. Combining two or more activities automatically creates the shared project and requires Agora Pro. There is no up-front project/type fork.</li><li>Three steps: <strong>Build → Presentation & team → Review & publish</strong>. Save drafts before committing to a plan.</li><li>Mapping → Proposals → Prioritising is an optional starting sequence. Prioritising can come first when there is already a shortlist.</li><li>Order is not an automatic scheduler. Upcoming activities open when the facilitator chooses.</li></ul><h2>3. Settings belong to each activity</h2><p><strong>Who can participate</strong> and <strong>visibility</strong> are independent controls on every activity card. Optional consultation defaults help repeated setups; explicit activity overrides win.</p><p>Listed controls discovery, not eligibility. Link-only activities still open by direct link. A shared project can be unlisted while an explicitly listed activity is discoverable; an explicitly link-only activity is omitted from the public project’s entry points. Inheriting activities remain accessible through their shared project link.</p><p>The proposed ALL/ANY participation rules combine account, email, strong verification and ticket requirements. The current backend’s modes and a generic policy engine are not assumed to be the same implementation.</p><h2>4. One question builder</h2><p>Onboarding and proposal collection use the same question schema and editor. A short shared demographic survey is a Pro feature; activities can inherit it, override it, or have no onboarding questions. Shared questions are answered once in this demo. Proposal collection uses the same free-text/choice controls, not a separate “Proposal form” system.</p><p>Mapping supports List and one-statement-at-a-time views. Prioritising retains Pairwise and Best/worst alongside credit allocation. Quadratic pricing and plural adjustment can be enabled together.</p><div class="row">${action({ name: "voting-guide", label: "Quadratic + plural explainer", style: "btn soft" })}${link({ to: "/features", label: "Full feature map", style: "btn", symbol: "grid" })}</div><h2>5. The supplied Agora Pro offer</h2><p><strong>€600 per month, including two members.</strong> Additional members are €50 per person per month. Educational institutions and NGOs receive 25% off in exchange for feedback and collaboration on a case study or research paper.</p><ul>${PRO_FEATURES.map((feature) => `<li>${feature}</li>`).join("")}</ul><p><strong>Bespoke, separately agreed:</strong> dynamic translation of participants’ contributions; a customized Machine Learning Report inspired by Jigsaw Sensemaker; a dedicated remote facilitator at €120/hour. Pro’s one included onboarding/training hour is a one-time inclusion, not monthly remote facilitation.</p><p class="hint">The quote example applies the discount to the recurring Pro subtotal including extra seats. Bespoke services remain separately quoted. No subscription or service is activated by a real payment in this prototype.</p><h2>6. Preserve intent across authentication</h2><p>Browse and draft first. At a contribution, verify what that activity requires, reuse sufficient credentials, collect its onboarding answers and resume the intended action. Saving to an account or publishing can secure the existing guest identity. A signed-in participant keeps the same account when facilitating.</p><p>Guest upgrade should preserve identity and votes. Signing into a different existing account still needs a deliberate linking/recovery policy. Survey affiliation is not organization membership and never grants management access.</p><h2>7. Sources and implementation boundaries</h2><p>The input HTMLs, <code>puja-builder-feedback.html</code> and <code>solidago-quadratic-plural-brief.html</code> informed this proposal. The feature map traces current code for languages, surveys, email updates, analysis, reports, documents, profiles and settings. Site-admin routes and entitlements retain their access distinctions.</p><p>This is an interactive local prototype. Shared-form proposals, the wider process builder, generic eligibility rules and expanded voting choices are product designs, not claims that all are deployed. Payments, invitations, verification, email delivery and collective/plural scoring are simulated. The top-strip account selector is only a demo control.</p><p>Figma’s local desktop MCP returned access errors for the supplied nodes; those frames were not inspected. Production integration should preserve existing URLs, use SpaLink in the Vue app and retain cached data and scroll.</p><div class="row">${link           state.persona = name === "auth-new" ? "new" : "facilitator";
          closeDialog();
          const complete = pendingAction;
          pendingAction = undefined;
          persist();
          if (complete) complete();
          render();
          return;
        }
        if (name === "verify") {
          closeDialog();
          const complete = pendingAction;
          pendingAction = undefined;
          if (complete) complete();
          return;
        }
        if (name === "new") {
          newConsultation(id);
          return;
        }
        if (name === "filter") {
          discoverFilter = id;
          render();
          return;
        }
        if (name === "clear-search") {
          searchText = "";
          discoverFilter = "all";
          render();
          return;
        }
        if (name === "save-draft" || name === "publish") {
          commitProject({ id, publish: name === "publish" });
          return;
        }
        if (name === "add-activity" || name === "remove-activity") {
          if (name === "add-activity") {
            openActivityLibrary();
            return;
          }
          const project = context();
          if (!project) return;
          const draft = editable(project);
          draft.activities = draft.activities.filter(
            (activity) => activity.id !== id
          );
          for (const activity of draft.activities)
            if (configValue({ target: activity, key: "options:source" }) === id)
              configOf(activity)["options:source"] = "";
          setConsultationShape(draft);
          persist();
          render();
          return;
        }
        if (name === "share") {
          const project = findProject(id);
          if (project)
            openShare({
              project,
              activity: project.activities.find(
                (activity) => activity.id === button.dataset.activity
              ),
            });
          return;
        }
        if (name === "copy-link") {
          const input = $("#share-url");
          try {
            await navigator.clipboard.writeText(input.value);
            notify("Prototype participant link copied.");
          } catch {
            input.select();
            notify(
              "Select and copy the link above. Clipboard access is unavailable."
            );
          }
          return;
        }
        if (name === "vote") {
          const project = findProject(id);
          const activity = project?.activities.find(
            (item) => item.id === button.dataset.activity
          );
          if (!project || !activity || activity.status !== "open") return;
          const index = Number(button.dataset.index);
          const value = button.dataset.vote;
          requireEligibility({
            project,
            activity,
            complete: () => {
              const key = participationKey({ project, activity, index });
              if (state.votes[key] === value) delete state.votes[key];
              else state.votes[key] = value;
              rememberParticipation({
                project,
                path: activityPath({ project, activity }),
              });
              render();
              notify("Reaction saved in this prototype.");
            },
          });
          return;
        }
        if (name === "rank-choice") {
          const index = Number(button.dataset.index);
          const choice = button.dataset.choice;
          const opposite = choice === "most" ? "least" : "most";
          const selection = rankingSelection[id] || {};
          if (selection[opposite] === index) delete selection[opposite];
          if (selection[choice] === index) delete selection[choice];
          else selection[choice] = index;
          rankingSelection[id] = selection;
          render();
          return;
        }
        if (name === "rank-submit") {
          const project = findProject(id);
          const activity = project?.activities.find(
            (item) => item.id === button.dataset.activity
          );
          if (!project || !activity || activity.status !== "open") return;
          requireEligibility({
            project,
            activity,
            complete: () => {
              state.votes[`${project.id}:${activity.id}:ranking`] =
                JSON.stringify(
                  rankingSelection[`${project.id}:${activity.id}:ranking`]
                );
              rememberParticipation({
                project,
                path: activityPath({ project, activity }),
              });
              render();
              notify("Sample comparison saved.");
            },
          });
          return;
        }
        if (name === "review" || name === "undo-review") {
          if (name === "review" && !state.reviewed.includes(id))
            state.reviewed.push(id);
          else if (name === "undo-review")
            state.reviewed = state.reviewed.filter((value) => value !== id);
          persist();
          render();
          notify(
            name === "review"
              ? "Review decision saved."
              : "Review decision undone."
          );
          return;
        }
        if (name === "journeys") {
          openDialog({
            title: "Try a connected journey",
            body: `<p class="dialog-copy">Use the prototype like an app. The menu, breadcrumbs, browser Back, builder and dashboard all connect.</p><div class="dialog-actions">${action({ name: "journey-participant", label: "Sam: participate → start my own", style: "btn primary" })}${action({ name: "journey-owner", label: "Alex: manage → participant view → back" })}${action({ name: "journey-guest", label: "Guest: landing → build → publish" })}${action({ name: "try-voting", label: "Quadratic + plural · one ballot", style: "btn soft" })}${link({ to: "/project/crypto", label: "Open an expert invitation link", symbol: "link" })}${link({ to: "/notes", label: "Read the navigation rationale", style: "btn quiet" })}</div><p class="hint" style="margin-top:20px">The top-strip account selector is a demo control, not a participant/facilitator role switch.</p>`,
          });
          return;
        }
        if (name === "journey-participant") {
          closeDialog();
          switchPersona("participant");
          navigate("/project/amplify/conversation/ideas");
          return;
        }
        if (name === "journey-owner") {
          closeDialog();
          switchPersona("facilitator");
          navigate("/manage/crypto");
          return;
        }
        if (name === "journey-guest") {
          closeDialog();
          switchPersona("visitor");
          navigate("/");
          return;
        }
        if (name === "reset") {
          state = seed();
          rankingSelection = {};
          creditDrafts = {};
          pairwiseDrafts = {};
          searchText = "";
          discoverFilter = "all";
          scrollPositions.clear();
          recordedVisitPath = "";
          managementReturns.clear();
          persist();
          navigate("/");
          notify("Local prototype reset.");
        }
      });
      document.addEventListener("input", (event) => {
        const input = event.target;
        if (
          !(
            input instanceof HTMLInputElement ||
            input instanceof HTMLTextAreaElement ||
            input instanceof HTMLSelectElement
          )
        )
          return;
        if (input.id === "project-language-search") {
          languageSearch = input.value;
          $("#project-language-options").innerHTML =
            pageLanguageOptionsMarkup();
          return;
        }
        if (input.dataset.questionId && surveyEditorState) {
          const question = surveyEditorState.questions.find(
            (item) => item.id === input.dataset.questionId
          );
          const field = input.dataset.questionField;
          if (
            question &&
            ["text", "type", "options", "required"].includes(field)
          )
            question[field] =
              field === "required"
                ? input.checked
                : field === "options"
                  ? input.value
                      .split("\n")
                      .map((value) => value.trim())
                      .filter(Boolean)
                  : input.value;
          return;
        }
        if (input.id === "plan-discount" && planProject) {
          configOf(planProject)["plan:discount"] =
            input.value === "partner" ? "partner" : "standard";
          $("#plan-summary").innerHTML = renderPlanCard(planProject);
          persist();
          return;
        }
        if (input.dataset.config) {
          const project = context();
          if (!project || parts()[0] !== "builder") return;
          const draft = editable(project);
          const target = input.dataset.activity
            ? draft.activities.find(
                (activity) => activity.id === input.dataset.activity
              )
            : draft;
          if (!target) return;
          configOf(target)[input.dataset.config] =
            input.type === "checkbox"
              ? input.checked
                ? "on"
                : "off"
              : input.value;
          persist();
          attachBuilderControls();
          return;
        }
        if (input.closest("#voting-setup-form")) {
          updateVotingSetup();
          return;
        }
        const ruleForm = input.closest("#eligibility-form");
        if (ruleForm) {
          const inherited = $("#rule-source")?.value === "inherit";
          $("#rule-custom").disabled = inherited;
          const formData = new FormData(ruleForm);
          const project = findProject(ruleForm.dataset.project);
          const target =
            ruleForm.dataset.scope === "builder" && project
              ? editable(project)
              : project;
          const policy =
            inherited && target
              ? effectivePolicy({ project: target })
              : {
                  mode: formData.get("mode") === "any" ? "any" : "all",
                  rules: formData
                    .getAll("rule")
                    .filter((value) => typeof value === "string"),
                };
          $("#rule-summary").textContent =
            `${inherited ? "Inherited: " : ""}${policySummary(policy)}`;
          return;
        }
        if (input.id === "discover-search") {
          searchText = input.value;
          $("#discovery-results").innerHTML = discoveryCards();
          return;
        }
        if (input.dataset.field || input.dataset.activityField) {
          const project = context();
          if (!project || parts()[0] !== "builder") return;
          const draft = editable(project);
          const field = input.dataset.field;
          if (
            field &&
            ["title", "description", "owner", "visibility"].includes(field)
          ) {
            const previousTitle = draft.title;
            draft[field] = input.value;
            if (field === "owner")
              draft.ownerName =
                input.value === "psaros"
                  ? "Psaros Center"
                  : isSignedIn()
                    ? accountName()
                    : "You";
            if (
              field === "title" &&
              draft.type === "single" &&
              draft.activities[0] &&
              (draft.activities[0].title === "" ||
                draft.activities[0].title === previousTitle)
            )
              draft.activities[0].title = input.value;
          }
          const activity = draft.activities.find(
            (item) => item.id === input.dataset.activity
          );
          const activityField = input.dataset.activityField;
          if (
            activity &&
            [
              "title",
              "description",
              "type",
              "access",
              "statements",
              "status",
            ].includes(activityField)
          ) {
            if (activityField === "access") {
              if (!isRecord(activity.prototypeConfig))
                activity.prototypeConfig = {};
              activity.prototypeConfig["eligibility:source"] =
                input.value === "inherit" ? "inherit" : "custom";
              delete activity.prototypeConfig["eligibility:rules"];
              if (["open", "email"].includes(input.value))
                activity.access = input.value;
            } else
              activity[activityField] =
                activityField === "statements"
                  ? input.value
                      .split("\n")
                      .map((line) => line.trim())
                      .filter(Boolean)
                  : input.value;
            if (activityField === "title" && draft.activities.length === 1)
              draft.title = input.value;
            const heading = $(
              `[data-stage-id="${activity.id}"] .stage-toggle strong`
            );
            if (heading && activityField === "title")
              heading.textContent = input.value || stageKind(activity).label;
          }
          persist();
          const preview = $("#live-preview");
          if (preview) preview.innerHTML = builderPreview(draft);
          applyProjectPalette();
        }
      });
      document.addEventListener("change", async (event) => {
        const input = event.target;
        if (
          input instanceof HTMLInputElement &&
          input.id === "brand-logo-upload"
        ) {
          const file = input.files?.[0];
          const project = context();
          if (!file || !project) return;
          if (
            !["image/png", "image/jpeg", "image/webp"].includes(file.type) ||
            file.size > 1024 * 1024
          ) {
            notify(
              "Choose a PNG, JPEG or WebP up to 1 MB for the local preview."
            );
            return;
          }
          try {
            const url = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.addEventListener("load", () => resolve(reader.result));
              reader.addEventListener("error", () => reject(reader.error));
              reader.readAsDataURL(file);
            });
            if (typeof url === "string") {
              configOf(editable(project))["brand:logo"] = url;
              persist();
              render();
            }
          } catch {
            notify("Could not read that image.");
          }
          return;
        }
        if (
          input instanceof HTMLInputElement &&
          input.dataset.config === "brand:enabled"
        ) {
          render();
          return;
        }
        if (!(input instanceof HTMLSelectElement)) return;
        if (input.id === "preview-page") {
          previewActivityId = input.value;
          const project = context();
          if (project)
            $("#live-preview").innerHTML = builderPreview(editable(project));
          applyProjectPalette();
          return;
        }
        if (input.id === "survey-mode" && surveyEditorState) {
          surveyEditorState.mode = input.value;
          if (input.value === "custom" && !surveyEditorState.questions.length) {
            const project = findProject(surveyEditorState.projectId);
            if (project)
              surveyEditorState.questions = structuredClone(
                readQuestions({ target: editable(project) })
              );
          }
          renderSurveyEditor();
          return;
        }
        if (input.dataset.questionField === "type" && surveyEditorState) {
          renderSurveyEditor();
          return;
        }
        if (input.id === "persona") {
          switchPersona(input.value);
          return;
        }
        if (input.id === "workspace") {
          state.workspace = input.value;
          persist();
          render();
          return;
        }
        if (["type", "access"].includes(input.dataset.activityField)) render();
      });
      document.addEventListener("submit", (event) => {
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "onboarding-survey-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const project = findProject(form.dataset.project);
          const activity = project?.activities.find(
            (item) => item.id === form.dataset.activity
          );
          if (!project || !activity) return;
          const survey = effectiveSurvey({ project, activity });
          const answers = Object.fromEntries(
            [...new FormData(form)].filter(
              ([, value]) => typeof value === "string"
            )
          );
          state.preferences[`onboarding:${survey.key}`] = JSON.stringify({
            signature: JSON.stringify(survey.questions),
            answers,
          });
          persist();
          const complete = pendingAction;
          pendingAction = undefined;
          closeDialog();
          if (complete) complete();
          return;
        }
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "proposal-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const project = findProject(form.dataset.project);
          const activity = project?.activities.find(
            (item) => item.id === form.dataset.activity
          );
          if (!project || !activity || activity.status !== "open") return;
          const answers = Object.fromEntries(
            [...new FormData(form)].filter(
              ([, value]) => typeof value === "string"
            )
          );
          const title = String(
            Object.values(answers).find((value) => value.trim()) ||
              "Untitled proposal"
          ).slice(0, 160);
          requireEligibility({
            project,
            activity,
            complete: () => {
              const rows = collectionSubmissions({ project, activity });
              rows.push({ id: crypto.randomUUID(), title, answers });
              state.preferences[`collection:${project.id}:${activity.id}`] =
                JSON.stringify(rows);
              rememberParticipation({
                project,
                path: activityPath({ project, activity }),
              });
              render();
              notify("Proposal saved in this local prototype.");
            },
          });
          return;
        }
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "team-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const project = findProject(form.dataset.project);
          if (!project) return;
          const draft = editable(project);
          const data = new FormData(form);
          const members = teamMembers(draft);
          const email = String(data.get("email") || "").trim();
          if (
            members.some(
              (member) => member.email.toLowerCase() === email.toLowerCase()
            )
          ) {
            notify("That email is already in the draft team.");
            return;
          }
          members.push({
            id: crypto.randomUUID(),
            name: String(data.get("name") || "").trim(),
            email,
          });
          configOf(draft)["team:members"] = JSON.stringify(members);
          persist();
          closeDialog();
          render();
          return;
        }
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "visibility-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const project = findProject(form.dataset.project);
          if (!project) return;
          const draft = editable(project);
          const activity = draft.activities.find(
            (item) => item.id === form.dataset.activity
          );
          const value = new FormData(form).get("visibility");
          if (activity && ["inherit", "listed", "unlisted"].includes(value))
            configOf(activity)["visibility:source"] = value;
          else if (["listed", "unlisted"].includes(value))
            draft.visibility = value;
          persist();
          closeDialog();
          render();
          return;
        }
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "bespoke-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const project = findProject(form.dataset.project);
          if (!project) return;
          const target = parts()[0] === "builder" ? editable(project) : project;
          const config = configOf(target);
          const data = new FormData(form);
          config["languages:dynamic"] = data.has("translation")
            ? "Request bespoke translation"
            : "Off";
          config["bespoke:report"] = data.has("report") ? "requested" : "";
          config["bespoke:facilitator"] = data.has("facilitator")
            ? "requested"
            : "";
          config["bespoke:context"] = String(data.get("context") || "");
          persist();
          closeDialog();
          render();
          notify(
            "Support request kept in this prototype. No message was sent."
          );
          return;
        }
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "voting-setup-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const config = votingConfigFromForm(form);
          if (
            (config.plural || config.compare) &&
            config.dimensions.length === 0
          ) {
            notify("Select at least one dimension for the plural result.");
            return;
          }
          if (
            (config.plural || config.compare) &&
            config.dimensions.includes("Opinion groups") &&
            !config.opinionSource
          ) {
            notify("Link the conversation providing opinion groups.");
            form.querySelector('[name="opinion-source"]')?.focus();
            return;
          }
          const store = optionStore({
            projectId: form.dataset.project,
            activityId: form.dataset.activity,
            scope: form.dataset.scope,
          });
          Object.assign(store, {
            "voting:interaction": config.interaction,
            "voting:quadratic": config.quadratic ? "on" : "off",
            "voting:plural": config.plural ? "on" : "off",
            "voting:compare": config.compare ? "on" : "off",
            "voting:budget": String(config.budget),
            "voting:dimensions": JSON.stringify(config.dimensions),
            "voting:opinion-source": config.opinionSource,
          });
          persist();
          closeDialog();
          render();
          notify(
            "Voting setup saved. Quadratic and plural options are independent."
          );
          return;
        }
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "feature-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const feature = getFeature(form.dataset.feature);
          if (!feature) return;
          const store = optionStore({
            projectId: form.dataset.project,
            activityId: form.dataset.activity,
            scope: form.dataset.scope,
          });
          if (feature.id === "email-setup") {
            const data = new FormData(form);
            const enabled =
              data.get("email-setup:override") === "On" ||
              (data.get("email-setup:override") !== "Off" &&
                data.get("email-setup:default") === "On");
            if (
              enabled &&
              !String(data.get("email-setup:contact") || "").trim()
            ) {
              notify(
                "Add a participant contact email before enabling updates."
              );
              form.querySelector('input[type="email"]')?.focus();
              return;
            }
          }
          for (const [key, value] of new FormData(form))
            if (typeof value === "string") store[key] = value;
          persist();
          closeDialog();
          render();
          notify("Prototype choices saved locally.");
          return;
        }
        if (
          event.target instanceof HTMLFormElement &&
          event.target.id === "eligibility-form"
        ) {
          event.preventDefault();
          const form = event.target;
          const data = new FormData(form);
          const store = optionStore({
            projectId: form.dataset.project,
            activityId: form.dataset.activity,
            scope: form.dataset.scope,
          });
          store["eligibility:source"] =
            data.get("source") === "inherit" ? "inherit" : "custom";
          if (store["eligibility:source"] === "custom") {
            store["eligibility:mode"] =
              data.get("mode") === "any" ? "any" : "all";
            store["eligibility:rules"] = JSON.stringify(
              data
                .getAll("rule")
                .filter((value) => RULES.some((rule) => rule.id === value))
            );
          }
          persist();
          closeDialog();
          render();
          notify("Participation rules saved in this prototype.");
          return;
        }
        if (
          !(event.target instanceof HTMLFormElement) ||
          event.target.id !== "statement-form"
        )
          return;
        event.preventDefault();
        const form = event.target;
        const project = findProject(form.dataset.project);
        const activity = project?.activities.find(
          (item) => item.id === form.dataset.activity
        );
        const text = new FormData(form).get("statement");
        if (!project || !activity || typeof text !== "string" || !text.trim())
          return;
        requireEligibility({
          project,
          activity,
          complete: () => {
            activity.statements.push(text.trim());
            rememberParticipation({
              project,
              path: activityPath({ project, activity }),
            });
            render();
            notify("Statement added in this prototype.");
          },
        });
      });
      $("#dialog").addEventListener("cancel", () => {
        pendingAction = undefined;
      });
      $("#dialog").addEventListener("close", () => {
        if (!$("#dialog").open && documentObjectUrl) {
          URL.revokeObjectURL(documentObjectUrl);
          documentObjectUrl = undefined;
        }
      });
      document.addEventListener("keydown", (event) => {
        if (
          event.target instanceof HTMLInputElement &&
          event.target.id === "project-language-search" &&
          event.key === "Enter"
        ) {
          event.preventDefault();
          $("#project-language-options .language-option")?.click();
        }
      });
      for (const dialog of [$("#dialog"), $("#menu")])
        dialog.addEventListener("click", (event) => {
          if (event.target !== dialog) return;
          const bounds = dialog.getBoundingClientRect();
          if (
            event.clientX < bounds.left ||
            event.clientX > bounds.right ||
            event.clientY < bounds.top ||
            event.clientY > bounds.bottom
          ) {
            dialog.close();
            pendingAction = undefined;
          }
        });
      window.addEventListener("hashchange", () => {
        if (previousRoute) scrollPositions.set(previousRoute, window.scrollY);
        closeDialog();
        if ($("#menu").open) $("#menu").close();
        render();
        previousRoute = route();
        $("#main").focus({ preventScroll: true });
        window.scrollTo(0, scrollPositions.get(route()) || 0);
      });
      render();
      previousRoute = route();
    </script>
  </body>
</html>
