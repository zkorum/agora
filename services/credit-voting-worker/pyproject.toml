[project]
name = "agora-credit-voting-worker"
version = "0.1.0"
description = "QV live participation statistics and durable frozen-result processing"
requires-python = ">=3.13"
dependencies = [
    "agora-shared-analysis-worker",
    "psycopg[binary]>=3.2",
    "sqlalchemy[postgresql-psycopg]>=2.0",
]

[tool.uv]
required-version = ">=0.13.4"
exclude-newer = "5 days"

[tool.uv.sources]
agora-shared-analysis-worker = { path = "../shared-analysis-worker", editable = true }
agora-shared-language = { path = "../shared-language", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "basedpyright>=1.29", "testcontainers[postgres]>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_voting_worker"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "N", "UP", "B", "A", "SIM", "TCH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/credit_voting_worker/generated_models.py" = ["TCH003"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
extraPaths = ["src", "../shared-analysis-worker/src", "../shared-language/src"]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
