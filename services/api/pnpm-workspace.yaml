minimumReleaseAge: 7200
minimumReleaseAgeExclude:
    - "@zkorum/lingua-wasm@1.8.0"

allowBuilds:
    # Optional SSH accelerators used by Testcontainers; its JS fallback needs no node-gyp.
    cpu-features: false
    esbuild: true
    opencc: true
    protobufjs: false
    ssh2: false

overrides:
    "@protobufjs/utf8": "1.1.1"
    "fast-xml-builder": "1.1.7"
    "fast-xml-parser": ">=5.7.0"
    "@eslint/plugin-kit": ">=0.3.4"
    "@stablelib/ed25519": "2.1.0"
    circom_tester: "0.0.24"
    esbuild: ">=0.25.0"
    js-yaml: ">=4.1.1"
    jsonpath: "1.3.0"
    underscore: "1.13.8"
    "@tootallnate/once": "3.0.1"

patchedDependencies:
    "@zk-kit/eddsa-poseidon@1.1.0": patches/@zk-kit__eddsa-poseidon@1.1.0.patch
