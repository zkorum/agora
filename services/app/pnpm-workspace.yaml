minimumReleaseAge: 7200
minimumReleaseAgeExclude:
  - "@sveltejs/kit@2.60.1"
  - devalue@5.8.1
  - svelte@5.55.7

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  "eslint>ajv": "^6.14.0"
  "@eslint/eslintrc>ajv": "^6.14.0"
  cookie: ">=0.7.0"
  # GHSA-rj75-hqrm-r3gf: typography still pins an affected parser release.
  "@tailwindcss/typography>postcss-selector-parser": "6.1.5"
  # GHSA-g3hv-75wg-m249: ESLint/config-array/TS-ESTree use the retained match APIs.
  # Import-X needs 4.18.0 first: older versions import makeRe, removed in v11.
  "minimatch@10": "11.0.5"
