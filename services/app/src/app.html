<!doctype html>
<html
  lang="%lang%"
  dir="%dir%"
  class="scroll-smooth notranslate"
  translate="no"
>
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Plausible Analytics (production only) -->
    <script>
      if (
        location.hostname === "agoracitizen.network" ||
        location.hostname.endsWith(".agoracitizen.network")
      ) {
        const s = document.createElement("script");
        s.defer = true;
        s.dataset.domain = "agoracitizen.network";
        s.src = "https://plausible.io/js/script.outbound-links.js";
        document.head.appendChild(s);
      }
      window.plausible =
        window.plausible ||
        function () {
          (window.plausible.q = window.plausible.q || []).push(arguments);
        };
    </script>
    <script>
      (function () {
        const SUPPORTED_LOCALES = "%locales%".split(",");
        const DEFAULT_LOCALE = "%baseLocale%";
        const STORAGE_KEY = "displayLanguage";

        function parseSupportedLocale(rawLanguage) {
          if (!rawLanguage) return null;

          const lang = rawLanguage.toLowerCase();
          if (
            lang === "zh-tw" ||
            lang === "zh-hk" ||
            lang.startsWith("zh-hant")
          ) {
            return "zh-hant";
          }
          if (lang.startsWith("zh")) {
            return "zh-hans";
          }

          const primary = lang.split("-")[0];
          return SUPPORTED_LOCALES.includes(primary) ? primary : null;
        }

        function detectDeviceLocale() {
          try {
            return parseSupportedLocale(
              new Intl.DateTimeFormat().resolvedOptions().locale,
            );
          } catch (_) {
            return null;
          }
        }

        function detectBrowserLocale() {
          const languages = [...navigator.languages, navigator.language];
          for (const language of languages) {
            const locale = parseSupportedLocale(language);
            if (locale) return locale;
          }
          return null;
        }

        function getPreferredLocale() {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            const savedLocale = parseSupportedLocale(saved);
            if (savedLocale) return savedLocale;
          } catch (_) {
            // Storage can be unavailable in private or embedded browsing.
          }
          // Product policy: only Android prefers Intl; desktop and iOS/iPadOS
          // prefer website languages, regardless of browser brand.
          return /\bAndroid\b/i.test(navigator.userAgent)
            ? detectDeviceLocale() || detectBrowserLocale() || DEFAULT_LOCALE
            : detectBrowserLocale() || detectDeviceLocale() || DEFAULT_LOCALE;
        }

        function handleLanguageRedirect() {
          // Negotiate only an initial homepage visit; shared resource URLs and
          // internal navigation already express a language choice.
          if (location.pathname !== "/") return;
          if (
            document.referrer &&
            new URL(document.referrer).origin === location.origin
          ) {
            return;
          }

          const preferredLocale = getPreferredLocale();
          if (preferredLocale !== DEFAULT_LOCALE) {
            location.replace(
              "/" + preferredLocale + location.search + location.hash,
            );
          }
        }

        handleLanguageRedirect();
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
