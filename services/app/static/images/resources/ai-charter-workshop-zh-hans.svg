<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" lang="zh-hans" xml:lang="zh-hans">
  <title id="title">从团队意见到持续更新的 AI 章程</title>
  <desc id="desc">四个步骤：会前问卷、对话模式、优先排序模式和持续更新的章程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6cff"/>
      <stop offset="1" stop-color="#4d9cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2d226c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8478bd"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="180" fill="#a391ff" opacity="0.09"/>
  <circle cx="95" cy="620" r="190" fill="#74c8ff" opacity="0.1"/>
  <g font-family="Arial, sans-serif">
    <text x="600" y="105" text-anchor="middle" fill="#2d226c" font-size="36.00" font-weight="700">一天内，由团队共同制定 AI 章程</text>
    <text x="600" y="150" text-anchor="middle" fill="#5f5a78" font-size="22.00" font-weight="400">从真实经验出发，形成共识、确定优先事项，让规则持续完善</text>
    <g filter="url(#shadow)">
  <g data-step="1">
    <rect x="75" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="190" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">会前</text>
    <text x="190" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">团队问卷</text>
    <text x="190" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">关于实际 AI 使用的</text>
    <text x="190" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">3 个问题，形成</text>
    <text x="190" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">6 条初始观点</text>
  </g>
  <g data-step="2">
    <rect x="350" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="465" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">全天</text>
    <text x="465" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">对话模式</text>
    <text x="465" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">25 位参与者</text>
    <text x="465" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">730 次投票</text>
    <text x="465" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">10 条共同认可的观点</text>
  </g>
  <g data-step="3">
    <rect x="625" y="245" width="230" height="210" rx="22" fill="#fff" stroke="url(#accent)" stroke-width="4"/>
    <text x="740" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">当天结束前</text>
    <text x="740" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">优先排序</text>
    <text x="740" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">将达成共识的观点</text>
    <text x="740" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">进行排序，确定</text>
    <text x="740" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">团队共同的优先事项</text>
  </g>
  <g data-step="4">
    <rect x="900" y="245" width="230" height="210" rx="22" fill="url(#accent)"/>
    <text x="1015" y="290" text-anchor="middle" fill="#fff" font-size="16.00" font-weight="600">每 3 个月</text>
    <text x="1015" y="335" text-anchor="middle" fill="#fff" font-size="24.00" font-weight="700">持续更新的章程</text>
    <text x="1015" y="375" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">通过抽签选出委员会</text>
    <text x="1015" y="403" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">重新审视并更新</text>
    <text x="1015" y="431" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">使用规则</text>
  </g>
    </g>
    <text x="600" y="565" text-anchor="middle" fill="#2d226c" font-size="27.00" font-weight="700">对话模式找到共同点。优先排序模式决定先做什么。</text>
    <text x="600" y="610" text-anchor="middle" fill="#5f5a78" font-size="20.00" font-weight="400">使用 Agora，由 Lyfe Catalyst 提供引导</text>
  </g>
  <g fill="none" stroke="#8478bd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M312 350 H330"/>
    <path d="M587 350 H605"/>
    <path d="M862 350 H880"/>
  </g>
</svg>
