<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">From team input to a living AI charter</title>
  <desc id="desc">A four-step process: pre-workshop survey, Conversation mode, Prioritization mode, and a living charter.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6cff"/>
      <stop offset="1" stop-color="#4d9cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2d226c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8478bd"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="180" fill="#a391ff" opacity="0.09"/>
  <circle cx="95" cy="620" r="190" fill="#74c8ff" opacity="0.1"/>
  <text x="80" y="105" fill="#2d226c" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">A team-written AI charter in one day</text>
  <text x="80" y="150" fill="#5f5a78" font-family="Inter, Arial, sans-serif" font-size="22">From lived experience to consensus, priorities, and an evolving policy</text>

  <g filter="url(#shadow)" font-family="Inter, Arial, sans-serif">
    <rect x="80" y="245" width="230" height="210" rx="22" fill="#ffffff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="105" y="290" fill="#756f8e" font-size="17" font-weight="600">BEFORE THE DAY</text>
    <text x="105" y="335" fill="#2d226c" font-size="25" font-weight="700">Team survey</text>
    <text x="105" y="375" fill="#55506d" font-size="18">3 questions on real</text>
    <text x="105" y="403" fill="#55506d" font-size="18">AI use become</text>
    <text x="105" y="431" fill="#55506d" font-size="18">6 seed statements</text>

    <rect x="355" y="245" width="230" height="210" rx="22" fill="#ffffff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="380" y="290" fill="#756f8e" font-size="17" font-weight="600">ALL DAY</text>
    <text x="380" y="335" fill="#2d226c" font-size="25" font-weight="700">Conversation</text>
    <text x="380" y="375" fill="#55506d" font-size="18">25 participants</text>
    <text x="380" y="403" fill="#55506d" font-size="18">730 votes</text>
    <text x="380" y="431" fill="#55506d" font-size="18">10 shared statements</text>

    <rect x="630" y="245" width="230" height="210" rx="22" fill="#ffffff" stroke="url(#accent)" stroke-width="4"/>
    <text x="655" y="290" fill="#756f8e" font-size="17" font-weight="600">END OF DAY</text>
    <text x="655" y="335" fill="#2d226c" font-size="25" font-weight="700">Prioritization</text>
    <text x="655" y="375" fill="#55506d" font-size="18">Consensus items</text>
    <text x="655" y="403" fill="#55506d" font-size="18">ranked into shared</text>
    <text x="655" y="431" fill="#55506d" font-size="18">team priorities</text>

    <rect x="905" y="245" width="215" height="210" rx="22" fill="url(#accent)"/>
    <text x="930" y="290" fill="#ffffff" font-size="17" font-weight="600" opacity="0.85">EVERY 3 MONTHS</text>
    <text x="930" y="335" fill="#ffffff" font-size="25" font-weight="700">Living charter</text>
    <text x="930" y="375" fill="#ffffff" font-size="18">A committee drawn</text>
    <text x="930" y="403" fill="#ffffff" font-size="18">by lot revisits and</text>
    <text x="930" y="431" fill="#ffffff" font-size="18">updates the rules</text>
  </g>

  <g fill="none" stroke="#8478bd" stroke-width="4" marker-end="url(#arrow)">
    <path d="M315 350 H342"/>
    <path d="M590 350 H617"/>
    <path d="M865 350 H892"/>
  </g>

  <text x="600" y="565" text-anchor="middle" fill="#2d226c" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Conversation finds common ground. Prioritization decides what comes first.</text>
  <text x="600" y="610" text-anchor="middle" fill="#5f5a78" font-family="Inter, Arial, sans-serif" font-size="20">Built with Agora and facilitated by Lyfe Catalyst</text>
</svg>