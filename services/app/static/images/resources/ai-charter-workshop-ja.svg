<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" lang="ja" xml:lang="ja">
  <title id="title">チームの意見から、更新し続けるAI憲章へ</title>
  <desc id="desc">事前アンケート、会話モード、優先順位付けモード、更新し続ける憲章という4つのステップ。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6cff"/>
      <stop offset="1" stop-color="#4d9cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2d226c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8478bd"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="180" fill="#a391ff" opacity="0.09"/>
  <circle cx="95" cy="620" r="190" fill="#74c8ff" opacity="0.1"/>
  <g font-family="Arial, sans-serif">
    <text x="600" y="105" text-anchor="middle" fill="#2d226c" font-size="36.00" font-weight="700">チームでつくるAI憲章を、1日で</text>
    <text x="600" y="150" text-anchor="middle" fill="#5f5a78" font-size="22.00" font-weight="400">実体験から合意と優先事項へ。方針はその後も更新し続ける</text>
    <g filter="url(#shadow)">
  <g data-step="1">
    <rect x="75" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="190" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">ワークショップ前</text>
    <text x="190" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">チームアンケート</text>
    <text x="190" y="375" text-anchor="middle" fill="#55506d" font-size="17.41" font-weight="400">AIの実際の利用に関する</text>
    <text x="190" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">3つの質問から</text>
    <text x="190" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">6つの初期意見を作成</text>
  </g>
  <g data-step="2">
    <rect x="350" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="465" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">終日</text>
    <text x="465" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">会話モード</text>
    <text x="465" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">参加者25人</text>
    <text x="465" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">730票</text>
    <text x="465" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">10の共通の意見</text>
  </g>
  <g data-step="3">
    <rect x="625" y="245" width="230" height="210" rx="22" fill="#fff" stroke="url(#accent)" stroke-width="4"/>
    <text x="740" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">1日の終わり</text>
    <text x="740" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">優先順位付け</text>
    <text x="740" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">合意した意見を</text>
    <text x="740" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">順位付けし、チームの</text>
    <text x="740" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">共通の優先事項に</text>
  </g>
  <g data-step="4">
    <rect x="900" y="245" width="230" height="210" rx="22" fill="url(#accent)"/>
    <text x="1015" y="290" text-anchor="middle" fill="#fff" font-size="16.00" font-weight="600">3か月ごと</text>
    <text x="1015" y="335" text-anchor="middle" fill="#fff" font-size="24.00" font-weight="700">更新し続ける憲章</text>
    <text x="1015" y="375" text-anchor="middle" fill="#fff" font-size="17.64" font-weight="400">抽選で選ばれた委員会が</text>
    <text x="1015" y="403" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">ルールを見直し</text>
    <text x="1015" y="431" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">更新する</text>
  </g>
    </g>
    <text x="600" y="565" text-anchor="middle" fill="#2d226c" font-size="27.00" font-weight="700">会話で共通点を見つけ、優先順位付けで何から始めるかを決める。</text>
    <text x="600" y="610" text-anchor="middle" fill="#5f5a78" font-size="20.00" font-weight="400">Agoraを活用し、Lyfe Catalystが進行を支援</text>
  </g>
  <g fill="none" stroke="#8478bd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M312 350 H330"/>
    <path d="M587 350 H605"/>
    <path d="M862 350 H880"/>
  </g>
</svg>
