<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" lang="fa" xml:lang="fa">
  <title id="title">از مشارکت تیم تا منشور پویای هوش مصنوعی</title>
  <desc id="desc">چهار مرحله: پرسش‌نامه پیش از کارگاه، حالت گفت‌وگو، حالت اولویت‌بندی و منشور پویا.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6cff"/>
      <stop offset="1" stop-color="#4d9cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2d226c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8478bd"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="180" fill="#a391ff" opacity="0.09"/>
  <circle cx="95" cy="620" r="190" fill="#74c8ff" opacity="0.1"/>
  <g font-family="Arial, sans-serif" direction="rtl" unicode-bidi="plaintext">
    <text x="600" y="105" text-anchor="middle" fill="#2d226c" font-size="36.00" font-weight="700">منشور هوش مصنوعی، نوشته تیم در یک روز</text>
    <text x="600" y="150" text-anchor="middle" fill="#5f5a78" font-size="22.00" font-weight="400">از تجربه واقعی تا توافق، اولویت‌ها و قواعدی که تکامل می‌یابند</text>
    <g filter="url(#shadow)">
  <g data-step="1">
    <rect x="900" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="1015" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">پیش از کارگاه</text>
    <text x="1015" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">پرسش‌نامه تیم</text>
    <text x="1015" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">3 پرسش درباره کاربرد</text>
    <text x="1015" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">واقعی هوش مصنوعی</text>
    <text x="1015" y="431" text-anchor="middle" fill="#55506d" font-size="15.50" font-weight="400">به 6 گزاره آغازین می‌رسد</text>
  </g>
  <g data-step="2">
    <rect x="625" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="740" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">در طول روز</text>
    <text x="740" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">گفت‌وگو</text>
    <text x="740" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">25 شرکت‌کننده</text>
    <text x="740" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">730 رأی</text>
    <text x="740" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">10 گزاره مشترک</text>
  </g>
  <g data-step="3">
    <rect x="350" y="245" width="230" height="210" rx="22" fill="#fff" stroke="url(#accent)" stroke-width="4"/>
    <text x="465" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">پایان روز</text>
    <text x="465" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">اولویت‌بندی</text>
    <text x="465" y="375" text-anchor="middle" fill="#55506d" font-size="17.93" font-weight="400">گزاره‌های مورد توافق</text>
    <text x="465" y="403" text-anchor="middle" fill="#55506d" font-size="17.93" font-weight="400">رتبه‌بندی می‌شوند تا</text>
    <text x="465" y="431" text-anchor="middle" fill="#55506d" font-size="14.50" font-weight="400">اولویت‌های تیم شکل بگیرند</text>
  </g>
  <g data-step="4">
    <rect x="75" y="245" width="230" height="210" rx="22" fill="url(#accent)"/>
    <text x="190" y="290" text-anchor="middle" fill="#fff" font-size="16.00" font-weight="600">هر 3 ماه</text>
    <text x="190" y="335" text-anchor="middle" fill="#fff" font-size="24.00" font-weight="700">منشور پویا</text>
    <text x="190" y="375" text-anchor="middle" fill="#fff" font-size="15.85" font-weight="400">کمیته‌ای با انتخاب قرعه</text>
    <text x="190" y="403" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">قواعد را بازبینی</text>
    <text x="190" y="431" text-anchor="middle" fill="#fff" font-size="17.93" font-weight="400">و به‌روزرسانی می‌کند</text>
  </g>
    </g>
    <text x="600" y="565" text-anchor="middle" fill="#2d226c" font-size="25.99" font-weight="700">گفت‌وگو نقاط مشترک را آشکار می‌کند. اولویت‌بندی تعیین می‌کند از کجا شروع کنیم.</text>
    <text x="600" y="610" text-anchor="middle" fill="#5f5a78" font-size="20.00" font-weight="400">با استفاده از آگورا و تسهیلگری Lyfe Catalyst</text>
  </g>
  <g fill="none" stroke="#8478bd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M338 350 H320"/>
    <path d="M613 350 H595"/>
    <path d="M888 350 H870"/>
  </g>
</svg>
