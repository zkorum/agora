<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" lang="zh-hant" xml:lang="zh-hant">
  <title id="title">從團隊意見到持續更新的 AI 章程</title>
  <desc id="desc">四個步驟：會前問卷、對話模式、優先排序模式和持續更新的章程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ff"/>
      <stop offset="0.55" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#e9fbff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6cff"/>
      <stop offset="1" stop-color="#4d9cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2d226c" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8478bd"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="40" fill="url(#background)"/>
  <circle cx="1080" cy="80" r="180" fill="#a391ff" opacity="0.09"/>
  <circle cx="95" cy="620" r="190" fill="#74c8ff" opacity="0.1"/>
  <g font-family="Arial, sans-serif">
    <text x="600" y="105" text-anchor="middle" fill="#2d226c" font-size="36.00" font-weight="700">一天內，由團隊共同制定 AI 章程</text>
    <text x="600" y="150" text-anchor="middle" fill="#5f5a78" font-size="22.00" font-weight="400">從真實經驗出發，形成共識、確定優先事項，讓規則持續完善</text>
    <g filter="url(#shadow)">
  <g data-step="1">
    <rect x="75" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="190" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">會前</text>
    <text x="190" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">團隊問卷</text>
    <text x="190" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">關於實際 AI 使用的</text>
    <text x="190" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">3 個問題，形成</text>
    <text x="190" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">6 條初始觀點</text>
  </g>
  <g data-step="2">
    <rect x="350" y="245" width="230" height="210" rx="22" fill="#fff" stroke="#d8d2ec" stroke-width="2"/>
    <text x="465" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">全天</text>
    <text x="465" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">對話模式</text>
    <text x="465" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">25 位參與者</text>
    <text x="465" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">730 次投票</text>
    <text x="465" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">10 條共同認可的觀點</text>
  </g>
  <g data-step="3">
    <rect x="625" y="245" width="230" height="210" rx="22" fill="#fff" stroke="url(#accent)" stroke-width="4"/>
    <text x="740" y="290" text-anchor="middle" fill="#756f8e" font-size="16.00" font-weight="600">當天結束前</text>
    <text x="740" y="335" text-anchor="middle" fill="#2d226c" font-size="24.00" font-weight="700">優先排序</text>
    <text x="740" y="375" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">將達成共識的觀點</text>
    <text x="740" y="403" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">進行排序，確定</text>
    <text x="740" y="431" text-anchor="middle" fill="#55506d" font-size="18.00" font-weight="400">團隊共同的優先事項</text>
  </g>
  <g data-step="4">
    <rect x="900" y="245" width="230" height="210" rx="22" fill="url(#accent)"/>
    <text x="1015" y="290" text-anchor="middle" fill="#fff" font-size="16.00" font-weight="600">每 3 個月</text>
    <text x="1015" y="335" text-anchor="middle" fill="#fff" font-size="24.00" font-weight="700">持續更新的章程</text>
    <text x="1015" y="375" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">透過抽籤選出委員會</text>
    <text x="1015" y="403" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">重新審視並更新</text>
    <text x="1015" y="431" text-anchor="middle" fill="#fff" font-size="18.00" font-weight="400">使用規則</text>
  </g>
    </g>
    <text x="600" y="565" text-anchor="middle" fill="#2d226c" font-size="27.00" font-weight="700">對話模式找到共同點。優先排序模式決定先做什麼。</text>
    <text x="600" y="610" text-anchor="middle" fill="#5f5a78" font-size="20.00" font-weight="400">使用 Agora，由 Lyfe Catalyst 提供引導</text>
  </g>
  <g fill="none" stroke="#8478bd" stroke-width="3" marker-end="url(#arrow)">
    <path d="M312 350 H330"/>
    <path d="M587 350 H605"/>
    <path d="M862 350 H880"/>
  </g>
</svg>
